name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version without leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            REF="${{ inputs.version }}"
          else
            REF="${GITHUB_REF_NAME}"
          fi
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Pack Windows installer
        shell: cmd
        run: build.cmd PackWindowsInstaller --Version ${{ needs.version.outputs.version }}

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: artifacts/release/Mailtide-*-win-x64-setup.exe

  linux:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2
          sudo apt-get install -y clang zlib1g-dev

      - name: Decode Android keystore (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mailtide.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/mailtide.jks" >> "$GITHUB_ENV"
          fi

      - name: Pack AppImage and Android APK
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build.sh PackAppImage PublishAndroidApk --Version ${{ needs.version.outputs.version }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-android
          path: |
            artifacts/release/Mailtide-*-linux-x64.AppImage
            artifacts/release/Mailtide-*-android.apk

  release:
    needs: [version, windows, linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: dist

      - name: Download Linux / Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-android
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: Mailtide ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/Mailtide-*-win-x64-setup.exe
            dist/Mailtide-*-linux-x64.AppImage
            dist/Mailtide-*-android.apk
