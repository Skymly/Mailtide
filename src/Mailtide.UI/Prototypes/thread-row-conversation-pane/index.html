<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Thread row and conversation reading pane</title>
  <!--
    PROTOTYPE — throwaway. Not product UI.
    Question: How should a compact Thread row and the conversation
    reading pane look and behave?
    Three variants, switchable via ?variant=A|B|C.
    A — Sender-first triple / chips
    B — Two-line collapse / thumbs
    C — Subject-first / attach strip
    D — Lock: A row + C pane (#213)
    Unified Inbox vs Mailbox: ?unified=0
  -->
  <style>
    :root {
      --text: rgba(0, 0, 0, .9);
      --text-2: rgba(0, 0, 0, .61);
      --text-3: rgba(0, 0, 0, .45);
      --accent: #005fb8;
      --accent-hover: #005ba1;
      --accent-text: #fff;
      --bg: #f3f3f3;
      --layer: #fff;
      --nav: #f7f7f7;
      --stroke: rgba(0, 0, 0, .08);
      --hover: rgba(0, 0, 0, .045);
      --pressed: rgba(0, 0, 0, .07);
      --selected: #cfe4fa;
      --error: #c42b1c;
      --badge: #005fb8;
      --focus: #005fb8;
      --flag: #c42b1c;
      --shadow: 0 8px 24px rgba(0, 0, 0, .18);
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      --nav-w: 260px;
      --list-w: 340px;
      --row: 28px;
      --bar: 40px;
      --personal: #005fb8;
      --work: #0f7b0f;
      --qq: #c42b1c;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: rgba(255, 255, 255, .95);
        --text-2: rgba(255, 255, 255, .7);
        --text-3: rgba(255, 255, 255, .5);
        --accent: #60cdff;
        --accent-hover: #99ebff;
        --accent-text: #000;
        --bg: #202020;
        --layer: #2c2c2c;
        --nav: #272727;
        --stroke: rgba(255, 255, 255, .08);
        --hover: rgba(255, 255, 255, .06);
        --pressed: rgba(255, 255, 255, .08);
        --selected: #1a3d5c;
        --error: #ff99a4;
        --badge: #60cdff;
        --focus: #60cdff;
        --flag: #ff99a4;
        --personal: #60cdff;
        --work: #6ccb5f;
        --qq: #ff99a4;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 13px/1.3 var(--font);
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { display: flex; flex-direction: column; height: 100%; }

    .commandbar {
      display: flex; align-items: center; gap: 4px;
      height: var(--bar); padding: 0 8px;
      background: var(--layer); border-bottom: 1px solid var(--stroke); flex-shrink: 0;
    }
    .cmd {
      display: inline-flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent;
    }
    .cmd:hover { background: var(--hover); }
    .cmd:active { background: var(--pressed); }
    .cmd svg { width: 16px; height: 16px; fill: currentColor; }
    .cmd.accent { background: var(--accent); color: var(--accent-text); }
    .cmd.accent:hover { background: var(--accent-hover); }
    .more {
      width: 32px; height: 32px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; border-radius: 4px; background: transparent; color: var(--text-2);
    }
    .more:hover { background: var(--hover); color: var(--text); }
    .more svg { width: 16px; height: 16px; fill: currentColor; }

    .shell {
      display: grid;
      grid-template-columns: var(--nav-w) 1px var(--list-w) 1px minmax(0, 1fr);
      flex: 1; min-height: 0;
    }
    .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .split { background: var(--stroke); }

    .nav { background: var(--nav); padding: 6px 6px 0; }
    .nav-scroll { overflow: auto; flex: 1; }
    .tree-item, .tree-child, .tree-account {
      display: flex; align-items: center; gap: 8px;
      height: var(--row); padding: 0 8px; border: 0; border-radius: 4px;
      background: transparent; width: 100%; text-align: left;
    }
    .tree-item:hover, .tree-child:hover { background: var(--hover); }
    .tree-item[aria-selected="true"], .tree-child[aria-selected="true"] { background: var(--selected); }
    .tree-item svg, .tree-child svg, .tree-account svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
    .tree-item.unified { font-weight: 600; margin-bottom: 4px; }
    .chev { width: 10px; height: 10px; opacity: .65; }
    .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { color: var(--text-2); font-size: 12px; }
    .badge {
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--badge); color: var(--accent-text);
      font-size: 11px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .account-block { margin: 2px 0 6px; }
    .tree-child { padding-left: 34px; }
    .nav-footer { border-top: 1px solid var(--stroke); padding: 6px 0; }
    .add-account {
      display: flex; align-items: center; gap: 8px;
      height: 32px; width: 100%; padding: 0 8px;
      border: 0; border-radius: 4px; background: transparent; color: var(--accent);
    }
    .add-account:hover { background: var(--hover); }
    .add-account svg { width: 16px; height: 16px; }

    .list, .reading { background: var(--layer); }
    .list-header {
      display: flex; align-items: center; gap: 8px;
      min-height: 48px; padding: 8px;
      border-bottom: 1px solid var(--stroke); flex-shrink: 0;
    }
    .scope { font-size: 12px; color: var(--text-2); white-space: nowrap; }
    .search {
      flex: 1; display: flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 10px;
      border: 1px solid var(--stroke); border-radius: 4px; background: var(--bg);
    }
    .search:focus-within { outline: 2px solid var(--focus); outline-offset: -1px; }
    .search svg { width: 14px; height: 14px; fill: var(--text-3); }
    .search input { flex: 1; border: 0; background: transparent; outline: none; min-width: 0; }
    .threads { overflow: auto; flex: 1; padding: 4px; }

    .thread {
      width: 100%; text-align: left; border: 0; border-radius: 4px;
      background: transparent; color: inherit; padding: 6px 8px;
    }
    .thread:hover { background: var(--hover); }
    .thread[aria-selected="true"] { background: var(--selected); }
    .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .when { color: var(--text-2); font-size: 12px; white-space: nowrap; }
    .pip {
      width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0;
    }
    .pip.off { background: transparent; }
    .ico { width: 12px; height: 12px; fill: currentColor; flex-shrink: 0; }
    .ico.flag { color: var(--flag); }
    .ico.clip { color: var(--text-3); }
    .acct {
      font-size: 11px; color: var(--text-2);
      border: 1px solid var(--stroke); border-radius: 3px; padding: 0 5px; height: 16px;
      display: inline-flex; align-items: center; flex-shrink: 0;
    }
    .initial {
      width: 18px; height: 18px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 600; color: #fff; flex-shrink: 0;
    }
    .initial.personal { background: var(--personal); }
    .initial.work { background: var(--work); }
    .initial.qq { background: var(--qq); }
    .icons { display: inline-flex; align-items: center; gap: 4px; }

    /* A — triple-line sender-first */
    .row-a {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      column-gap: 8px; row-gap: 1px;
      min-height: 62px; align-items: center;
    }
    .row-a .pip { grid-row: 1 / span 3; }
    .row-a .from-line { grid-column: 2; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .row-a .from { font-weight: 400; min-width: 0; }
    .row-a.unread .from { font-weight: 600; }
    .row-a .when { grid-column: 3; grid-row: 1; }
    .row-a .subject { grid-column: 2 / -1; color: var(--text-2); }
    .row-a.unread .subject { color: var(--text); }
    .row-a .preview-line { grid-column: 2 / -1; display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-3); font-size: 12px; }

    /* B — two-line subject — preview */
    .row-b {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) auto;
      column-gap: 8px; row-gap: 1px;
      min-height: 44px; align-items: center;
    }
    .row-b .initial { grid-row: 1 / span 2; }
    .row-b .from-line { grid-column: 2; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .row-b .from { min-width: 0; }
    .row-b.unread .from { font-weight: 600; }
    .row-b .when { grid-column: 3; grid-row: 1; }
    .row-b .second { grid-column: 2 / -1; display: flex; min-width: 0; color: var(--text-2); font-size: 12px; }
    .row-b.unread .second .subj { color: var(--text); font-weight: 600; }
    .row-b .sep { color: var(--text-3); margin: 0 4px; flex-shrink: 0; }

    /* C — subject-first + trailing icons */
    .row-c {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 56px;
      column-gap: 8px; row-gap: 1px;
      min-height: 44px; align-items: center;
    }
    .row-c .subject { font-weight: 400; }
    .row-c.unread .subject { font-weight: 600; }
    .row-c .when { grid-column: 2; grid-row: 1; }
    .row-c .trail { grid-column: 3; grid-row: 1 / span 2; display: flex; flex-wrap: wrap; gap: 2px; justify-content: flex-end; align-content: center; }
    .row-c .second { grid-column: 1 / 3; color: var(--text-2); font-size: 12px; display: flex; min-width: 0; gap: 6px; }

    .read-empty, .read-thread {
      display: none; flex-direction: column; min-height: 0; height: 100%;
    }
    .app[data-surface="empty"] .read-empty { display: flex; }
    .app[data-surface="reading"] .read-thread { display: flex; }
    .read-empty {
      align-items: center; justify-content: center;
      color: var(--text-3); gap: 8px;
    }
    .read-empty svg { width: 40px; height: 40px; fill: currentColor; }
    .read-thread { overflow: auto; }

    .pane-head, .thread-head {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: flex-start; gap: 8px;
      padding: 12px 16px; background: var(--layer);
      border-bottom: 1px solid var(--stroke);
    }
    .pane-head h2, .thread-head h2 { font-size: 16px; font-weight: 600; margin: 0; flex: 1; min-width: 0; }
    .pane-head .sub, .thread-head .sub { color: var(--text-2); font-size: 12px; margin-top: 2px; }
    .head-text { flex: 1; min-width: 0; }
    .people { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .chip-person {
      font-size: 11px; padding: 1px 7px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--stroke); color: var(--text-2);
    }

    .msg { padding: 14px 16px 16px; border-bottom: 1px solid var(--stroke); }
    .msg-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .msg-who { flex: 1; min-width: 0; }
    .msg-from { font-weight: 600; }
    .msg-meta { color: var(--text-2); font-size: 12px; margin-top: 2px; }
    .msg p { margin: 0 0 8px; max-width: 62ch; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: #fff; flex-shrink: 0;
      background: var(--accent);
    }

    .collapsed {
      display: flex; align-items: center; gap: 8px;
      width: 100%; text-align: left; border: 0; background: transparent;
      padding: 8px 16px; color: inherit; border-bottom: 1px solid var(--stroke);
    }
    .collapsed:hover { background: var(--hover); }
    .collapsed .who { font-weight: 600; flex-shrink: 0; }
    .collapsed .snip { flex: 1; min-width: 0; color: var(--text-3); font-size: 12px; }

    .chips, .thumbs, .strip { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip, .thumb, .strip-item {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border: 1px solid var(--stroke); border-radius: 4px;
      background: var(--bg); font-size: 12px; color: inherit; text-align: left;
    }
    .chip:hover, .thumb:hover, .strip-item:hover { background: var(--hover); }
    .chip svg, .thumb svg, .strip-item svg { width: 14px; height: 14px; fill: currentColor; }
    .thumb { flex-direction: column; align-items: flex-start; width: 140px; padding: 10px; gap: 4px; }
    .thumb .name { font-weight: 600; }
    .thumb .size, .strip-item .size { color: var(--text-3); font-size: 11px; }
    .strip { padding: 8px 16px 12px; border-bottom: 1px solid var(--stroke); background: var(--bg); }
    .strip-label { width: 100%; font-size: 11px; color: var(--text-3); margin-bottom: 0; }

    .ctx {
      display: none; position: fixed; z-index: 20; min-width: 196px;
      padding: 4px; background: var(--layer); border: 1px solid var(--stroke);
      border-radius: 8px; box-shadow: var(--shadow);
    }
    .ctx button {
      display: block; width: 100%; text-align: left; border: 0;
      background: transparent; padding: 6px 10px; border-radius: 4px;
    }
    .ctx button:hover { background: var(--hover); }
    .ctx .sep { height: 1px; background: var(--stroke); margin: 4px 6px; }
    .toast {
      position: fixed; right: 16px; bottom: 64px; z-index: 40;
      display: none; padding: 10px 14px; background: var(--layer);
      border: 1px solid var(--stroke); border-radius: 8px; box-shadow: var(--shadow);
    }
    .switcher {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px; background: #111; color: #fff;
      box-shadow: var(--shadow);
      font: 12px/1.2 ui-monospace, Consolas, monospace;
      user-select: none;
    }
    .switcher button {
      width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: #333; color: #fff;
    }
    .switcher button:hover { background: #444; }
    .switcher .vlabel { min-width: 260px; text-align: center; }
    .switcher .tog { width: auto; padding: 0 10px; border-radius: 999px; }
    .switcher .state { color: #9ad; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="app" data-variant="A" data-surface="reading">
    <div class="commandbar">
      <button class="cmd accent" data-compose type="button">
        <svg viewBox="0 0 16 16"><path d="M2 13.5V11l7.4-7.4 2.5 2.5L4.5 13.5H2zm9.1-9.1.9-.9a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1 0 1.4l-.9.9-2.5-2.5z"/></svg>
        Compose
      </button>
      <button class="cmd" data-sync type="button">
        <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 5.3 3.2l-1.3.8A4.5 4.5 0 1 1 8 3.5V6l3-2.5L8 1v1z"/></svg>
        Sync
      </button>
    </div>

    <div class="shell">
      <nav class="pane nav">
        <div class="nav-scroll">
          <button class="tree-item unified" data-nav="unified" aria-selected="true" type="button">
            <svg viewBox="0 0 16 16"><path d="M1 3.5 8 1l7 2.5v9L8 15 1 12.5v-9zM8 2.2 2.2 4.2v7.6L8 13.8l5.8-2V4.2L8 2.2z"/></svg>
            <span class="label">Unified Inbox</span>
            <span class="count">14</span>
          </button>
          <div class="account-block">
            <div class="tree-account">
              <svg class="chev" viewBox="0 0 12 12"><path d="M3 2l6 4-6 4z"/></svg>
              <span class="label">Personal</span>
            </div>
            <button class="tree-child" data-nav="personal" type="button"><span class="label">Inbox</span><span class="count">8</span></button>
            <button class="tree-child" type="button"><span class="label">Sent</span></button>
            <button class="tree-child" type="button"><span class="label">Drafts</span></button>
            <button class="tree-child" type="button"><span class="label">Outbox</span><span class="badge">2</span></button>
          </div>
          <div class="account-block">
            <div class="tree-account">
              <svg class="chev" viewBox="0 0 12 12"><path d="M3 2l6 4-6 4z"/></svg>
              <span class="label">Work</span>
            </div>
            <button class="tree-child" data-nav="work" type="button"><span class="label">Inbox</span><span class="count">6</span></button>
            <button class="tree-child" type="button"><span class="label">Outbox</span></button>
          </div>
        </div>
        <div class="nav-footer">
          <button class="add-account" type="button" data-add>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
            Add Account
          </button>
        </div>
      </nav>
      <div class="split"></div>

      <section class="pane list">
        <div class="list-header">
          <span class="scope" data-scope>Unified Inbox</span>
          <label class="search">
            <svg viewBox="0 0 16 16"><path d="M7 2a5 5 0 1 1 3.4 8.6l2.8 2.8-.7.7-2.8-2.8A5 5 0 0 1 7 2zm0 1.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z"/></svg>
            <input placeholder="Search  is:unread  is:flagged" />
          </label>
        </div>
        <div class="threads" id="threads"></div>
      </section>
      <div class="split"></div>

      <section class="pane reading">
        <div class="read-empty">
          <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v.8l7 4.2 7-4.2V7H5zm0 3.3V17h14V10.3l-7 4.2-7-4.2z"/></svg>
          Select a Thread
        </div>
        <div class="read-thread" id="read-thread"></div>
      </section>
    </div>
  </div>

  <div class="ctx" id="ctx" role="menu"></div>
  <div class="toast" id="toast"></div>

  <div class="switcher" id="switcher">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <div class="vlabel" id="vlabel">A — Sender-first triple / chips</div>
    <button type="button" id="next" aria-label="Next variant">→</button>
    <button class="tog" type="button" id="scope">Mailbox scope</button>
    <div class="state" id="state"></div>
  </div>

  <script>
    const CLIP = '<svg class="ico clip" viewBox="0 0 16 16"><path d="M5 2.5A2.5 2.5 0 0 0 2.5 5v5A3.5 3.5 0 0 0 6 13.5h.5V12H6A2.5 2.5 0 0 1 3.5 9.5V5A1.5 1.5 0 0 1 5 3.5h6A1.5 1.5 0 0 1 12.5 5v5a.5.5 0 0 1-1 0V6H10v4.5A2.5 2.5 0 0 0 12.5 13H13a3.5 3.5 0 0 0 3.5-3.5V5A2.5 2.5 0 0 0 14 2.5H5z"/></svg>';
    const FLAG = '<svg class="ico flag" viewBox="0 0 16 16"><path d="M3 2h8l-1.2 3L11 8H4v6H3V2z"/></svg>';
    const FILE = '<svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4V2zm5 0v3h3"/></svg>';
    const DOTS = '<svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>';

    const VARIANTS = [
      { key: "A", name: "Sender-first triple / chips" },
      { key: "B", name: "Two-line collapse / thumbs" },
      { key: "C", name: "Subject-first / attach strip" },
      { key: "D", name: "Lock: A row + C pane" },
    ];

    const THREADS = [
      {
        from: "Alex Chen", account: "Personal", accountKey: "personal",
        subject: "Q3 planning notes", preview: "Can we lock the Fluent shell before we start tickets?",
        when: "9:14 AM", unread: true, flagged: false,
        participants: ["Alex Chen", "You"],
        messages: [
          { from: "You", to: "Alex Chen", when: "Mon 4:02 PM", body: "Let's keep the daily surface to three panes. Attachments stay in the reading pane.", attachments: [] },
          { from: "Alex Chen", to: "you", when: "9:14 AM", body: "Can we lock the Fluent shell before we start tickets? I want the daily surface to feel like mail, not a debug console.", attachments: [] },
        ],
      },
      {
        from: "Jordan Lee", account: "Work", accountKey: "work",
        subject: "Invoice 1842", preview: "Invoice attached. Let me know if the reading pane should show the PDF here.",
        when: "Yesterday", unread: true, flagged: true,
        participants: ["Jordan Lee", "You"],
        messages: [
          { from: "You", to: "Jordan Lee", when: "Tue 11:20 AM", body: "Please send the PDF in-thread rather than a side column.", attachments: [] },
          { from: "Jordan Lee", to: "you", when: "Yesterday", body: "Invoice attached. Let me know if the reading pane should show the PDF chip here rather than a fourth column.", attachments: [{ name: "invoice-1842.pdf", size: "248 KB" }] },
        ],
      },
      {
        from: "Samira", account: "Personal", accountKey: "personal",
        subject: "Re: weekend hike", preview: "Leaving at 7. I'll bring the extra water filter.",
        when: "Mon", unread: false, flagged: false,
        participants: ["Samira", "You"],
        messages: [
          { from: "You", to: "Samira", when: "Sun 6:10 PM", body: "Are we still on for Sunday? I can drive.", attachments: [] },
          { from: "Samira", to: "you", when: "Mon 8:03 AM", body: "Leaving at 7. I'll bring the extra water filter.", attachments: [] },
          { from: "You", to: "Samira", when: "Mon 8:11 AM", body: "Perfect. See you at the trailhead.", attachments: [] },
        ],
      },
      {
        from: "GitHub", account: "Work", accountKey: "work",
        subject: "[Mailtide] CI passed on main", preview: "All 142 checks were successful.",
        when: "Sun", unread: false, flagged: false,
        participants: ["GitHub"],
        messages: [
          { from: "GitHub", to: "you", when: "Sun 2:41 AM", body: "All 142 checks were successful on main. No action needed.", attachments: [] },
        ],
      },
      {
        from: "Work standup", account: "Work", accountKey: "work",
        subject: "Tomorrow's agenda", preview: "Keep it to 15 minutes. Two decks attached.",
        when: "Sat", unread: false, flagged: true,
        participants: ["Work standup", "Alex Chen", "You"],
        messages: [
          { from: "Work standup", to: "you; Alex Chen", when: "Sat 5:02 PM", body: "Keep it to 15 minutes. Sync status is silent when Idle. Decks attached.", attachments: [
            { name: "agenda.docx", size: "32 KB" },
            { name: "metrics.xlsx", size: "118 KB" },
          ] },
        ],
      },
      {
        from: "QQ Mail", account: "QQ Mail", accountKey: "qq",
        subject: "Security notice", preview: "A new sign-in was detected. If this wasn't you, review the session.",
        when: "Fri", unread: true, flagged: false,
        participants: ["QQ Mail"],
        messages: [
          { from: "QQ Mail", to: "you", when: "Fri 9:40 PM", body: "A new sign-in was detected. If this wasn't you, review the session.", attachments: [] },
        ],
      },
    ];

    const app = document.querySelector(".app");
    const params = new URLSearchParams(location.search);
    let variant = (params.get("variant") || "A").toUpperCase();
    if (!VARIANTS.some(v => v.key === variant)) variant = "A";
    let unified = params.get("unified") !== "0";
    let nav = unified ? "unified" : "personal";
    let thread = 0;
    let surface = "reading";
    let lastAction = "none";
    let expanded = {};

    const threadsEl = document.getElementById("threads");
    const readEl = document.getElementById("read-thread");
    const ctx = document.getElementById("ctx");
    const toast = document.getElementById("toast");

    function visibleThreads() {
      if (nav === "unified") return THREADS.map((t, i) => ({ t, i }));
      return THREADS.map((t, i) => ({ t, i })).filter(x => x.t.accountKey === nav);
    }
    function threadAttachments(t) {
      return t.messages.flatMap(m => m.attachments || []);
    }
    function initialClass(key) {
      return key === "work" ? "work" : key === "qq" ? "qq" : "personal";
    }
    function initialLetter(account) { return account[0]; }
    function showUnifiedAccount() { return nav === "unified"; }

    function writeUrl() {
      const next = new URLSearchParams();
      next.set("variant", variant);
      if (!unified) next.set("unified", "0");
      history.replaceState(null, "", "?" + next.toString());
    }

    function iconBits(t) {
      const has = threadAttachments(t).length > 0;
      return (t.flagged ? FLAG : "") + (has ? CLIP : "");
    }

    function rowA(t, i, selected) {
      const unread = t.unread;
      const acct = showUnifiedAccount() ? `<span class="acct">${t.account}</span>` : "";
      return `<button class="thread row-a${unread ? " unread" : ""}" data-i="${i}" aria-selected="${selected}" type="button">
        <span class="pip${unread ? "" : " off"}"></span>
        <span class="from-line"><span class="from ellipsis">${t.from}</span>${acct}</span>
        <span class="when">${t.when}</span>
        <span class="subject ellipsis">${t.subject}</span>
        <span class="preview-line"><span class="ellipsis">${t.preview}</span><span class="icons">${iconBits(t)}</span></span>
      </button>`;
    }

    function rowB(t, i, selected) {
      const init = showUnifiedAccount()
        ? `<span class="initial ${initialClass(t.accountKey)}">${initialLetter(t.account)}</span>`
        : `<span></span>`;
      return `<button class="thread row-b${t.unread ? " unread" : ""}" data-i="${i}" aria-selected="${selected}" type="button">
        ${init}
        <span class="from-line"><span class="from ellipsis">${t.from}</span><span class="icons">${iconBits(t)}</span></span>
        <span class="when">${t.when}</span>
        <span class="second"><span class="subj ellipsis">${t.subject}</span><span class="sep">—</span><span class="ellipsis">${t.preview}</span></span>
      </button>`;
    }

    function rowC(t, i, selected) {
      const unreadPip = t.unread ? `<span class="pip"></span>` : "";
      const acct = showUnifiedAccount() ? `<span class="acct">${t.account}</span>` : "";
      return `<button class="thread row-c${t.unread ? " unread" : ""}" data-i="${i}" aria-selected="${selected}" type="button">
        <span class="subject ellipsis">${t.subject}</span>
        <span class="when">${t.when}</span>
        <span class="trail">${unreadPip}${iconBits(t)}${acct}</span>
        <span class="second"><span class="ellipsis">${t.from}</span><span class="ellipsis">${t.preview}</span></span>
      </button>`;
    }

    function chipRow(atts) {
      if (!atts.length) return "";
      return `<div class="chips">${atts.map(a =>
        `<button class="chip" type="button" data-open="${a.name}">${FILE}${a.name}</button>`
      ).join("")}</div>`;
    }
    function thumbRow(atts) {
      if (!atts.length) return "";
      return `<div class="thumbs">${atts.map(a =>
        `<button class="thumb" type="button" data-open="${a.name}">${FILE}<span class="name">${a.name}</span><span class="size">${a.size}</span></button>`
      ).join("")}</div>`;
    }
    function stripRow(atts) {
      if (!atts.length) return "";
      return `<div class="strip"><div class="strip-label">Attachments in this Thread</div>${atts.map(a =>
        `<button class="strip-item" type="button" data-open="${a.name}">${FILE}<span>${a.name}</span><span class="size">${a.size}</span></button>`
      ).join("")}</div>`;
    }

    function moreBtn(kind, i) {
      return `<button class="more" type="button" data-more="${kind}" data-i="${i}" aria-label="More">${DOTS}</button>`;
    }

    function msgA(m, mi) {
      return `<article class="msg" data-msg="${mi}">
        <div class="msg-head">
          <div class="msg-who">
            <div class="msg-from">${m.from}</div>
            <div class="msg-meta">To ${m.to} · ${m.when}</div>
          </div>
        </div>
        <p>${m.body}</p>
        ${chipRow(m.attachments || [])}
      </article>`;
    }

    function msgB(t, m, mi, isLast) {
      const key = thread + ":" + mi;
      const open = isLast || expanded[key];
      if (!open) {
        return `<button class="collapsed" type="button" data-expand="${mi}">
          <span class="who">${m.from}</span>
          <span class="snip ellipsis">${m.body}</span>
          <span class="when">${m.when}</span>
        </button>`;
      }
      return `<article class="msg" data-msg="${mi}">
        <div class="msg-head">
          <div class="msg-who">
            <div class="msg-from">${m.from}</div>
            <div class="msg-meta">To ${m.to} · ${m.when}${mi === t.messages.length - 1 ? " · " + t.subject : ""}</div>
          </div>
          ${moreBtn("message", mi)}
        </div>
        <p>${m.body}</p>
        ${thumbRow(m.attachments || [])}
      </article>`;
    }

    function msgC(m, mi) {
      const letter = m.from === "You" ? "Y" : m.from[0];
      return `<article class="msg" data-msg="${mi}">
        <div class="msg-head">
          <span class="avatar">${letter}</span>
          <div class="msg-who">
            <div class="msg-from">${m.from}</div>
            <div class="msg-meta">To ${m.to} · ${m.when}</div>
          </div>
        </div>
        <p>${m.body}</p>
      </article>`;
    }

    function readingA(t) {
      return `<div class="pane-head">
        <div class="head-text">
          <h2 class="ellipsis">${t.subject}</h2>
          <div class="sub">${t.messages.length} Messages in this Thread</div>
        </div>
        ${moreBtn("thread", thread)}
      </div>
      ${t.messages.map((m, mi) => msgA(m, mi)).join("")}`;
    }

    function readingB(t) {
      return t.messages.map((m, mi) => msgB(t, m, mi, mi === t.messages.length - 1)).join("");
    }

    function readingC(t) {
      const atts = threadAttachments(t);
      const people = t.participants.map(p => `<span class="chip-person">${p}</span>`).join("");
      return `<div class="thread-head">
        <div class="head-text">
          <h2 class="ellipsis">${t.subject}</h2>
          <div class="sub">${t.messages.length} Messages</div>
          <div class="people">${people}</div>
        </div>
        ${moreBtn("thread", thread)}
      </div>
      ${stripRow(atts)}
      ${t.messages.map((m, mi) => msgC(m, mi)).join("")}`;
    }

    function render() {
      app.dataset.variant = variant;
      app.dataset.surface = surface;
      const v = VARIANTS.find(x => x.key === variant);
      document.getElementById("vlabel").textContent = v.key + " — " + v.name;
      document.querySelector("[data-scope]").textContent = nav === "unified" ? "Unified Inbox" : (nav === "work" ? "Inbox · Work" : "Inbox · Personal");
      document.querySelectorAll("[data-nav]").forEach(el => {
        el.setAttribute("aria-selected", el.getAttribute("data-nav") === nav ? "true" : "false");
      });

      const vis = visibleThreads();
      if (!vis.some(x => x.i === thread)) {
        thread = vis[0] ? vis[0].i : null;
        surface = thread == null ? "empty" : "reading";
      }

      const rowFn = variant === "B" ? rowB : variant === "C" ? rowC : rowA;
      threadsEl.innerHTML = vis.map(({ t, i }) => rowFn(t, i, i === thread)).join("");

      const t = thread == null ? null : THREADS[thread];
      if (!t || surface !== "reading") readEl.innerHTML = "";
      else if (variant === "B") readEl.innerHTML = readingB(t);
      else if (variant === "C" || variant === "D") readEl.innerHTML = readingC(t);
      else readEl.innerHTML = readingA(t);

      document.getElementById("state").textContent =
        `scope=${nav} thread=${thread} surface=${surface} last=${lastAction}`;
      writeUrl();
    }

    function hideMenu() { ctx.style.display = "none"; }

    function cycle(dir) {
      const i = VARIANTS.findIndex(v => v.key === variant);
      variant = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key;
      expanded = {};
      lastAction = "variant " + variant;
      hideMenu();
      render();
    }

    function showToast(text) {
      lastAction = text;
      toast.textContent = text;
      toast.style.display = "block";
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => { toast.style.display = "none"; }, 1800);
      document.getElementById("state").textContent =
        `scope=${nav} thread=${thread} surface=${surface} last=${lastAction}`;
    }

    function placeMenu(x, y) {
      ctx.style.display = "block";
      const r = ctx.getBoundingClientRect();
      const left = Math.min(x, innerWidth - r.width - 8);
      const top = Math.min(y, innerHeight - r.height - 8);
      ctx.style.left = left + "px";
      ctx.style.top = top + "px";
    }

    function threadMenu() {
      return ["Reply", "Reply all", "Forward", "Flag", "Delete"].map(n =>
        `<button type="button" data-act="${n}">${n}</button>`).join("");
    }
    function messageMenu(mi) {
      const t = THREADS[thread];
      const atts = (t && t.messages[mi] && t.messages[mi].attachments) || [];
      const open = atts.map(a => `<button type="button" data-act="Open ${a.name}">Open ${a.name}</button>`).join("");
      return ["Reply", "Reply all", "Forward", "Flag", "Delete"].map(n =>
        `<button type="button" data-act="${n}">${n}</button>`).join("") +
        (open ? `<div class="sep"></div>${open}` : "");
    }

    function openMenu(kind, i, x, y) {
      ctx.innerHTML = kind === "message" ? messageMenu(i) : threadMenu();
      ctx.dataset.kind = kind;
      placeMenu(x, y);
    }

    document.getElementById("prev").onclick = () => cycle(-1);
    document.getElementById("next").onclick = () => cycle(1);
    document.getElementById("scope").onclick = () => {
      unified = !unified;
      nav = unified ? "unified" : "personal";
      lastAction = "scope " + nav;
      hideMenu();
      render();
    };

    document.addEventListener("keydown", (e) => {
      if (e.target.closest("input, textarea, [contenteditable]")) return;
      if (e.key === "ArrowLeft") cycle(-1);
      if (e.key === "ArrowRight") cycle(1);
    });

    app.addEventListener("click", (e) => {
      const navBtn = e.target.closest("[data-nav]");
      if (navBtn) {
        nav = navBtn.getAttribute("data-nav");
        unified = nav === "unified";
        lastAction = "nav " + nav;
        render();
        return;
      }
      const th = e.target.closest(".thread");
      if (th) {
        thread = Number(th.dataset.i);
        surface = "reading";
        THREADS[thread].unread = false;
        expanded = {};
        lastAction = "select thread " + thread;
        render();
        return;
      }
      if (e.target.closest("[data-compose]")) {
        showToast("Compose replaces reading pane — depth is #214");
        return;
      }
      if (e.target.closest("[data-sync]")) {
        showToast(nav === "unified" ? "Sync all Accounts" : "Sync selected Account");
        return;
      }
      if (e.target.closest("[data-add]")) {
        showToast("Add Account — out of scope");
        return;
      }
      const more = e.target.closest("[data-more]");
      if (more) {
        const kind = more.getAttribute("data-more");
        const i = Number(more.getAttribute("data-i"));
        const r = more.getBoundingClientRect();
        openMenu(kind, i, r.right - 8, r.bottom + 4);
        return;
      }
      const expand = e.target.closest("[data-expand]");
      if (expand) {
        expanded[thread + ":" + expand.getAttribute("data-expand")] = true;
        lastAction = "expand message";
        render();
        return;
      }
      const open = e.target.closest("[data-open]");
      if (open) {
        showToast("Open " + open.getAttribute("data-open"));
        return;
      }
      ctx.style.display = "none";
    });

    threadsEl.addEventListener("contextmenu", (e) => {
      const th = e.target.closest(".thread");
      if (!th) return;
      e.preventDefault();
      thread = Number(th.dataset.i);
      render();
      openMenu("thread", thread, e.clientX, e.clientY);
    });
    readEl.addEventListener("contextmenu", (e) => {
      const msg = e.target.closest("[data-msg]");
      e.preventDefault();
      if (msg) openMenu("message", Number(msg.getAttribute("data-msg")), e.clientX, e.clientY);
      else openMenu("thread", thread, e.clientX, e.clientY);
    });
    ctx.addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (b) showToast(b.getAttribute("data-act") + " — " + ctx.dataset.kind + " menu");
      hideMenu();
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#ctx, [data-more]")) hideMenu();
    });

    render();
  </script>
</body>
</html>
