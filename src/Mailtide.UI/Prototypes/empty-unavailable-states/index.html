<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Empty and unavailable states</title>
  <!--
    PROTOTYPE — throwaway. Not product UI.
    Question: How should empty and unavailable states look and behave
    in the locked compact Fluent 3-pane daily shell?
    Four variants, switchable via ?variant=A|B|C|D.
    A — Pane-local quiet
    B — Content-well collapse
    C — Status strip / blank / inline
    D — Lock: A empty + blank reading when list empty (#215)
    Scenes via ?scene=mailbox|unified|outbox|noselect|unavailable|offline
  -->
  <style>
    :root {
      --text: rgba(0, 0, 0, .9);
      --text-2: rgba(0, 0, 0, .61);
      --text-3: rgba(0, 0, 0, .45);
      --accent: #005fb8;
      --accent-hover: #005ba1;
      --accent-text: #fff;
      --bg: #f3f3f3;
      --layer: #fff;
      --nav: #f7f7f7;
      --stroke: rgba(0, 0, 0, .08);
      --hover: rgba(0, 0, 0, .045);
      --pressed: rgba(0, 0, 0, .07);
      --selected: #cfe4fa;
      --error: #c42b1c;
      --badge: #005fb8;
      --focus: #005fb8;
      --warn-bg: #fff4ce;
      --warn-stroke: #d6b400;
      --err-bg: #fde7e9;
      --shadow: 0 8px 24px rgba(0, 0, 0, .18);
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      --nav-w: 260px;
      --list-w: 340px;
      --row: 28px;
      --bar: 40px;
      --personal: #005fb8;
      --work: #0f7b0f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: rgba(255, 255, 255, .95);
        --text-2: rgba(255, 255, 255, .7);
        --text-3: rgba(255, 255, 255, .5);
        --accent: #60cdff;
        --accent-hover: #99ebff;
        --accent-text: #000;
        --bg: #202020;
        --layer: #2c2c2c;
        --nav: #272727;
        --stroke: rgba(255, 255, 255, .08);
        --hover: rgba(255, 255, 255, .06);
        --pressed: rgba(255, 255, 255, .08);
        --selected: #1a3d5c;
        --error: #ff99a4;
        --badge: #60cdff;
        --focus: #60cdff;
        --warn-bg: #433519;
        --warn-stroke: #d6b400;
        --err-bg: #442726;
        --personal: #60cdff;
        --work: #6ccb5f;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 13px/1.3 var(--font);
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { display: flex; flex-direction: column; height: 100%; }

    .commandbar {
      display: flex; align-items: center; gap: 4px;
      height: var(--bar); padding: 0 8px;
      background: var(--layer); border-bottom: 1px solid var(--stroke); flex-shrink: 0;
    }
    .cmd {
      display: inline-flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent;
    }
    .cmd:hover { background: var(--hover); }
    .cmd svg { width: 16px; height: 16px; fill: currentColor; }
    .cmd.accent { background: var(--accent); color: var(--accent-text); }
    .cmd.accent:hover { background: var(--accent-hover); }
    .more {
      width: 32px; height: 32px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; border-radius: 4px; background: transparent; color: var(--text-2);
    }
    .more:hover { background: var(--hover); color: var(--text); }
    .more svg { width: 16px; height: 16px; fill: currentColor; }

    .shell {
      display: grid;
      grid-template-columns: var(--nav-w) 1px var(--list-w) 1px minmax(0, 1fr);
      flex: 1; min-height: 0;
    }
    .app[data-variant="B"][data-empty-list="1"] .shell {
      grid-template-columns: var(--nav-w) 1px minmax(0, 1fr);
    }
    .app[data-variant="B"][data-empty-list="1"] .list,
    .app[data-variant="B"][data-empty-list="1"] .split-list { display: none; }
    .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .split { background: var(--stroke); }

    .nav { background: var(--nav); padding: 6px 6px 0; }
    .nav-scroll { overflow: auto; flex: 1; }
    .tree-item, .tree-child, .tree-account {
      display: flex; align-items: center; gap: 8px;
      height: var(--row); padding: 0 8px; border: 0; border-radius: 4px;
      background: transparent; width: 100%; text-align: left;
    }
    .tree-item:hover, .tree-child:hover { background: var(--hover); }
    .tree-item[aria-selected="true"], .tree-child[aria-selected="true"] { background: var(--selected); }
    .tree-item svg, .tree-child svg, .tree-account svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
    .tree-item.unified { font-weight: 600; margin-bottom: 4px; }
    .chev { width: 10px; height: 10px; opacity: .65; }
    .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { color: var(--text-2); font-size: 12px; }
    .badge {
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--badge); color: var(--accent-text);
      font-size: 11px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .account-block { margin: 2px 0 6px; }
    .tree-child { padding-left: 34px; }
    .nav-footer { border-top: 1px solid var(--stroke); padding: 6px 0; }
    .add-account {
      display: flex; align-items: center; gap: 8px;
      height: 32px; width: 100%; padding: 0 8px;
      border: 0; border-radius: 4px; background: transparent; color: var(--accent);
    }
    .add-account:hover { background: var(--hover); }
    .add-account svg { width: 16px; height: 16px; }

    .list, .reading { background: var(--layer); }
    .list-header {
      display: flex; align-items: center; gap: 8px;
      min-height: 48px; padding: 8px;
      border-bottom: 1px solid var(--stroke); flex-shrink: 0;
    }
    .scope { font-size: 12px; color: var(--text-2); white-space: nowrap; }
    .search {
      flex: 1; display: flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 10px;
      border: 1px solid var(--stroke); border-radius: 4px; background: var(--bg);
    }
    .search svg { width: 14px; height: 14px; fill: var(--text-3); }
    .search input { flex: 1; border: 0; background: transparent; outline: none; min-width: 0; }
    .threads { overflow: auto; flex: 1; padding: 4px; position: relative; }

    .strip {
      display: none; align-items: center; gap: 8px;
      margin: 0; padding: 8px 12px; font-size: 12px; color: var(--text-2);
      background: var(--bg); border-bottom: 1px solid var(--stroke); flex-shrink: 0;
    }
    .app[data-variant="C"][data-empty-list="1"] .strip { display: flex; }

    .thread {
      width: 100%; text-align: left; border: 0; border-radius: 4px;
      background: transparent; color: inherit; padding: 6px 8px;
    }
    .thread:hover { background: var(--hover); }
    .thread[aria-selected="true"] { background: var(--selected); }
    .row-a {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      column-gap: 8px; row-gap: 1px;
      min-height: 56px; align-items: center;
    }
    .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .pip.off { background: transparent; }
    .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .when { color: var(--text-2); font-size: 12px; white-space: nowrap; }
    .from-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .acct {
      font-size: 10px; padding: 0 5px; height: 16px; border-radius: 3px;
      display: inline-flex; align-items: center; flex-shrink: 0;
      background: var(--bg); border: 1px solid var(--stroke); color: var(--text-2);
    }
    .unread .from { font-weight: 600; }
    .subject { color: var(--text-2); }
    .unread .subject { color: var(--text); }
    .preview-line { color: var(--text-3); font-size: 12px; }

    .pane-empty, .read-empty, .well, .read-thread {
      display: none; flex-direction: column; min-height: 0;
    }
    .pane-empty, .read-empty, .well {
      align-items: center; justify-content: center;
      text-align: center; gap: 8px; padding: 24px;
      color: var(--text-3); flex: 1;
    }
    .pane-empty svg, .read-empty svg, .well svg {
      width: 48px; height: 48px; fill: currentColor;
    }
    .pane-empty h2, .read-empty h2, .well h2 {
      margin: 0; font-size: 16px; font-weight: 600; color: var(--text);
    }
    .pane-empty p, .read-empty p, .well p {
      margin: 0; max-width: 36ch; color: var(--text-2);
    }
    .app[data-variant="A"][data-empty-list="1"] .pane-empty,
    .app[data-variant="D"][data-empty-list="1"] .pane-empty { display: flex; }
    .app[data-variant="A"][data-empty-list="1"] .threads,
    .app[data-variant="D"][data-empty-list="1"] .threads,
    .app[data-variant="C"][data-empty-list="1"] .threads { display: none; }
    .app[data-variant="D"][data-empty-list="1"][data-surface="empty"] .read-empty { display: none; }

    .app[data-variant="B"][data-empty-list="1"] .well { display: flex; }
    .app[data-variant="B"][data-empty-list="1"] .read-empty,
    .app[data-variant="B"][data-empty-list="1"] .read-thread { display: none !important; }
    .well { height: 100%; }
    .well svg { width: 64px; height: 64px; fill: var(--accent); }

    .app[data-surface="empty"] .read-empty { display: flex; }
    .app[data-surface="reading"] .read-thread { display: flex; overflow: auto; }
    .app[data-variant="C"][data-surface="empty"] .read-empty { display: none; }
    .app[data-variant="B"][data-surface="empty"] .read-empty svg { width: 64px; height: 64px; fill: var(--accent); }
    .app[data-variant="B"][data-surface="empty"] .read-empty h2 { display: block; }

    .primary, .ghost {
      height: 32px; padding: 0 14px; border-radius: 4px; border: 0;
    }
    .primary { background: var(--accent); color: var(--accent-text); }
    .primary:hover { background: var(--accent-hover); }
    .ghost {
      border: 1px solid var(--stroke); background: transparent;
    }
    .ghost:hover { background: var(--hover); }
    .linkish {
      height: 24px; padding: 0 8px; border: 0; border-radius: 4px;
      background: transparent; color: var(--accent);
    }
    .linkish:hover { background: var(--hover); }

    .thread-head {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: flex-start; gap: 8px;
      padding: 12px 16px; background: var(--layer);
      border-bottom: 1px solid var(--stroke);
    }
    .thread-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
    .thread-head .sub { color: var(--text-2); font-size: 12px; margin-top: 2px; }
    .head-text { flex: 1; min-width: 0; }
    .people { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .chip-person {
      font-size: 11px; padding: 1px 7px; border-radius: 10px;
      background: var(--bg); border: 1px solid var(--stroke); color: var(--text-2);
    }
    .strip-attach {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 8px 16px 12px; border-bottom: 1px solid var(--stroke); background: var(--bg);
    }
    .strip-item {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 6px 10px; border: 1px solid var(--stroke); border-radius: 4px;
      background: var(--layer); font-size: 12px;
    }

    .infobar {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 16px; background: var(--err-bg);
      border-bottom: 1px solid var(--stroke); font-size: 12px;
    }
    .infobar.warn { background: var(--warn-bg); }
    .infobar span { flex: 1; }

    .msg { padding: 14px 16px 16px; border-bottom: 1px solid var(--stroke); }
    .msg-head { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .msg-from { font-weight: 600; }
    .msg-meta { color: var(--text-2); font-size: 12px; margin-top: 2px; }
    .msg p { margin: 0 0 8px; max-width: 62ch; }
    .avatar {
      width: 28px; height: 28px; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 600; color: #fff; flex-shrink: 0;
      background: var(--accent);
    }
    .avatar.work { background: var(--work); }

    .card {
      margin: 8px 0 0; padding: 16px; border: 1px solid var(--stroke);
      border-radius: 8px; background: var(--bg); max-width: 44ch;
      display: flex; flex-direction: column; align-items: flex-start; gap: 8px;
    }
    .card h3 { margin: 0; font-size: 14px; }
    .card p { margin: 0; color: var(--text-2); font-size: 12px; }
    .card.error { border-color: var(--error); }
    .placeholder {
      margin-top: 8px; padding: 12px;
      border: 1px dashed var(--stroke); border-radius: 4px;
      color: var(--text-3); font-size: 12px;
      display: flex; align-items: center; gap: 8px;
    }
    .skel { height: 10px; border-radius: 4px; background: var(--stroke); margin: 8px 0; }
    .skel.w2 { width: 80%; } .skel.w3 { width: 62%; } .skel.w4 { width: 40%; }

    .takeover {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 10px; text-align: center; height: 100%; padding: 32px;
    }
    .app[data-variant="B"][data-takeover="1"] .read-thread { display: none !important; }
    .app[data-variant="B"][data-takeover="1"] .takeover { display: flex; }
    .takeover svg { width: 64px; height: 64px; fill: var(--accent); }
    .takeover.error svg { fill: var(--error); }
    .takeover h2 { margin: 0; font-size: 18px; }
    .takeover p { margin: 0; color: var(--text-2); max-width: 40ch; }
    .takeover .acts { display: flex; gap: 8px; margin-top: 8px; }

    .toast {
      position: fixed; right: 16px; bottom: 64px; z-index: 40;
      display: none; padding: 10px 14px; background: var(--layer);
      border: 1px solid var(--stroke); border-radius: 8px; box-shadow: var(--shadow);
    }
    .switcher {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px; background: #111; color: #fff;
      box-shadow: var(--shadow);
      font: 12px/1.2 ui-monospace, Consolas, monospace;
      user-select: none;
    }
    .switcher button {
      width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: #333; color: #fff;
    }
    .switcher button:hover { background: #444; }
    .switcher .vlabel { min-width: 220px; text-align: center; }
    .switcher select {
      height: 28px; border: 0; border-radius: 999px;
      background: #333; color: #fff; padding: 0 10px;
    }
    .switcher .state { color: #9ad; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="app" data-variant="D" data-empty-list="0" data-surface="empty" data-takeover="0">
    <div class="commandbar">
      <button class="cmd accent" data-compose type="button">
        <svg viewBox="0 0 16 16"><path d="M2 13.5V11l7.4-7.4 2.5 2.5L4.5 13.5H2zm9.1-9.1.9-.9a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1 0 1.4l-.9.9-2.5-2.5z"/></svg>
        Compose
      </button>
      <button class="cmd" data-sync type="button">
        <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 5.3 3.2l-1.3.8A4.5 4.5 0 1 1 8 3.5V6l3-2.5L8 1v1z"/></svg>
        Sync
      </button>
    </div>

    <div class="shell">
      <nav class="pane nav">
        <div class="nav-scroll">
          <button class="tree-item unified" data-nav="unified" type="button">
            <svg viewBox="0 0 16 16"><path d="M1 3.5 8 1l7 2.5v9L8 15 1 12.5v-9zM8 2.2 2.2 4.2v7.6L8 13.8l5.8-2V4.2L8 2.2z"/></svg>
            <span class="label">Unified Inbox</span>
            <span class="count" data-count-unified>3</span>
          </button>
          <div class="account-block">
            <div class="tree-account">
              <svg class="chev" viewBox="0 0 12 12"><path d="M3 2l6 4-6 4z"/></svg>
              <span class="label">Personal</span>
            </div>
            <button class="tree-child" data-nav="personal/inbox" type="button"><span class="label">Inbox</span><span class="count" data-count-inbox>2</span></button>
            <button class="tree-child" data-nav="personal/sent" type="button"><span class="label">Sent</span></button>
            <button class="tree-child" data-nav="personal/drafts" type="button"><span class="label">Drafts</span></button>
            <button class="tree-child" data-nav="personal/outbox" type="button"><span class="label">Outbox</span></button>
          </div>
          <div class="account-block">
            <div class="tree-account">
              <svg class="chev" viewBox="0 0 12 12"><path d="M3 2l6 4-6 4z"/></svg>
              <span class="label">Work</span>
            </div>
            <button class="tree-child" data-nav="work/inbox" type="button"><span class="label">Inbox</span><span class="count">1</span></button>
            <button class="tree-child" data-nav="work/outbox" type="button"><span class="label">Outbox</span></button>
          </div>
        </div>
        <div class="nav-footer">
          <button class="add-account" data-add type="button">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
            Add Account
          </button>
        </div>
      </nav>
      <div class="split"></div>

      <section class="pane list">
        <div class="list-header">
          <span class="scope" data-scope>Unified Inbox</span>
          <label class="search">
            <svg viewBox="0 0 16 16"><path d="M7 2a5 5 0 1 1 3.4 8.6l2.8 2.8-.7.7-2.8-2.8A5 5 0 0 1 7 2zm0 1.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z"/></svg>
            <input placeholder="Search  is:unread  is:flagged" />
          </label>
        </div>
        <div class="strip" data-strip></div>
        <div class="pane-empty" id="list-empty"></div>
        <div class="threads" id="threads"></div>
      </section>
      <div class="split split-list"></div>

      <section class="pane reading">
        <div class="well" id="well"></div>
        <div class="read-empty" id="read-empty"></div>
        <div class="takeover" id="takeover"></div>
        <div class="read-thread" id="read-thread"></div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="switcher" id="switcher">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <div class="vlabel" id="vlabel">A — Pane-local quiet</div>
    <button type="button" id="next" aria-label="Next variant">→</button>
    <select id="scene" aria-label="Scene"></select>
    <div class="state" id="state"></div>
  </div>

  <script>
    const MAIL = '<svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v.8l7 4.2 7-4.2V7H5zm0 3.3V17h14V10.3l-7 4.2-7-4.2z"/></svg>';
    const WARN = '<svg viewBox="0 0 24 24"><path d="M12 3 2 21h20L12 3zm0 5 7.2 12H4.8L12 8zm-1 4h2v5h-2v-5zm0 6h2v2h-2v-2z"/></svg>';
    const CLOUD = '<svg viewBox="0 0 24 24"><path d="M6.5 20A4.5 4.5 0 0 1 6 11.1 6 6 0 0 1 17.5 10a4.5 4.5 0 0 1 .5 9H6.5z"/></svg>';
    const DOTS = '<svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>';
    const FILE = '<svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4V2zm5 0v3h3"/></svg>';

    const VARIANTS = [
      { key: "A", name: "Pane-local quiet" },
      { key: "B", name: "Content-well collapse" },
      { key: "C", name: "Status strip / blank / inline" },
      { key: "D", name: "Lock: A empty + blank reading" },
    ];
    const SCENES = [
      { key: "mailbox", name: "Empty Mailbox", nav: "personal/sent", emptyList: true },
      { key: "unified", name: "Empty Unified Inbox", nav: "unified", emptyList: true },
      { key: "outbox", name: "Empty Outbox", nav: "personal/outbox", emptyList: true },
      { key: "noselect", name: "No Thread selected", nav: "unified", emptyList: false, selected: null },
      { key: "unavailable", name: "Body unavailable", nav: "unified", emptyList: false, selected: 1 },
      { key: "offline", name: "Offline copy", nav: "unified", emptyList: false, selected: 2 },
    ];
    const SCOPES = {
      unified: "Unified Inbox",
      "personal/inbox": "Personal · Inbox",
      "personal/sent": "Personal · Sent",
      "personal/drafts": "Personal · Drafts",
      "personal/outbox": "Personal · Outbox",
      "work/inbox": "Work · Inbox",
      "work/outbox": "Work · Outbox",
    };
    const COPY = {
      mailbox: {
        title: "This Mailbox is empty",
        sub: "Personal · Sent has no Messages.",
        cta: "Compose",
        ctaAct: "compose",
        strip: "Personal · Sent is empty",
      },
      unified: {
        title: "Unified Inbox is empty",
        sub: "No Messages from any Inbox-role Mailbox.",
        cta: "Sync",
        ctaAct: "sync",
        strip: "Unified Inbox is empty",
      },
      outbox: {
        title: "Outbox is empty",
        sub: "Nothing waiting to send. Sync flushes queued Messages.",
        cta: null,
        strip: "Outbox is empty · flushes with Sync",
      },
    };

    const THREADS = [
      {
        from: "Alex Chen", account: "Personal",
        subject: "Q3 planning notes", preview: "Can we lock the Fluent shell before we start tickets?",
        when: "9:14 AM", unread: false,
        participants: ["Alex Chen", "You"],
        messages: [
          { from: "You", when: "Mon 4:02 PM", body: "Let's keep the daily surface to three panes.", state: "ok" },
          { from: "Alex Chen", when: "9:14 AM", body: "Can we lock the Fluent shell before we start tickets?", state: "ok" },
        ],
      },
      {
        from: "Jordan Lee", account: "Work",
        subject: "Invoice 1842", preview: "Invoice attached — body failed to load.",
        when: "Yesterday", unread: true,
        participants: ["Jordan Lee", "You"],
        attachments: [{ name: "invoice-1842.pdf", size: "248 KB" }],
        messages: [
          { from: "You", when: "Tue 11:20 AM", body: "Please send the PDF in-thread.", state: "ok" },
          { from: "Jordan Lee", when: "Yesterday", body: "Invoice attached. Body fetch failed.", state: "unavailable",
            error: "Couldn't load this body" },
        ],
      },
      {
        from: "Kai Nguyen", account: "Personal",
        subject: "Offsite itinerary", preview: "Headers only — body isn't on this device.",
        when: "Mon", unread: true,
        participants: ["Kai Nguyen", "You"],
        messages: [
          { from: "You", when: "Sun 6:10 PM", body: "Send the itinerary when you have it.", state: "ok" },
          { from: "Kai Nguyen", when: "Mon", body: "Itinerary attached below — flights Friday, hotel downtown.", state: "offline" },
        ],
      },
    ];

    const app = document.querySelector(".app");
    const params = new URLSearchParams(location.search);
    let variant = (params.get("variant") || "D").toUpperCase();
    if (!VARIANTS.some(v => v.key === variant)) variant = "A";
    let scene = (params.get("scene") || "mailbox").toLowerCase();
    if (!SCENES.some(s => s.key === scene)) scene = "mailbox";
    let lastAction = "load";
    let recovered = { unavailable: false, offline: false };
    let selectedOverride = null;

    const sceneSel = document.getElementById("scene");
    sceneSel.innerHTML = SCENES.map(s =>
      `<option value="${s.key}">${s.name}</option>`
    ).join("");

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }
    function sceneDef() { return SCENES.find(s => s.key === scene); }
    function emptyList() { return !!sceneDef().emptyList; }
    function selectedIndex() {
      if (selectedOverride != null) return selectedOverride;
      const s = sceneDef();
      return s.selected === undefined ? null : s.selected;
    }
    function writeUrl() {
      const next = new URLSearchParams();
      next.set("variant", variant);
      next.set("scene", scene);
      history.replaceState(null, "", "?" + next.toString());
    }
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => { t.style.display = "none"; }, 1600);
    }

    function emptyCopy() { return COPY[scene] || COPY.mailbox; }

    function renderNav() {
      const nav = sceneDef().nav;
      document.querySelectorAll("[data-nav]").forEach(el => {
        el.setAttribute("aria-selected", el.getAttribute("data-nav") === nav ? "true" : "false");
      });
      document.querySelector("[data-scope]").textContent = SCOPES[nav] || nav;
      document.querySelector("[data-count-unified]").textContent = scene === "unified" ? "0" : "3";
      document.querySelector("[data-count-inbox]").textContent = "2";
    }

    function renderList() {
      const copy = emptyCopy();
      document.getElementById("list-empty").innerHTML = emptyList() ? `
        ${MAIL}
        <h2>${esc(copy.title)}</h2>
        <p>${esc(copy.sub)}</p>` : "";
      document.querySelector("[data-strip]").textContent = emptyList() ? copy.strip : "";
      if (emptyList()) {
        document.getElementById("threads").innerHTML = "";
        return;
      }
      const sel = selectedIndex();
      document.getElementById("threads").innerHTML = THREADS.map((t, i) => `
        <button class="thread${t.unread ? " unread" : ""}" data-i="${i}" aria-selected="${i === sel}" type="button">
          <div class="row-a">
            <span class="pip${t.unread ? "" : " off"}"></span>
            <span class="from-line"><span class="from ellipsis">${esc(t.from)}</span><span class="acct">${esc(t.account)}</span></span>
            <span class="when">${esc(t.when)}</span>
            <span class="subject ellipsis" style="grid-column:2/-1">${esc(t.subject)}</span>
            <span class="preview-line ellipsis" style="grid-column:2/-1">${esc(t.preview)}</span>
          </div>
        </button>`).join("");
    }

    function renderWell() {
      const copy = emptyCopy();
      const cta = copy.cta
        ? `<button class="primary" type="button" data-act="${copy.ctaAct}">${esc(copy.cta)}</button>`
        : "";
      document.getElementById("well").innerHTML = emptyList() ? `
        ${MAIL}
        <h2>${esc(copy.title)}</h2>
        <p>${esc(copy.sub)}</p>
        ${cta}` : "";
    }

    function renderReadEmpty() {
      const quiet = variant === "A" || variant === "D";
      document.getElementById("read-empty").innerHTML = `
        ${MAIL}
        ${quiet ? "" : "<h2>Select a Thread</h2>"}
        <p>${quiet ? "Select a Thread" : "The list has Threads. Nothing is selected yet."}</p>`;
    }

    function msgState(m) {
      if (m.state === "unavailable" && recovered.unavailable) return "ok";
      if (m.state === "offline" && recovered.offline) return "ok";
      return m.state;
    }

    function renderMessage(m, threadTakeover) {
      const st = msgState(m);
      const avClass = m.from === "Jordan Lee" ? "avatar work" : "avatar";
      const initial = m.from[0];
      let body = "";
      if (st === "ok") {
        body = `<p>${esc(m.body)}</p>`;
      } else if (st === "unavailable") {
        if (variant === "C") {
          body = `<div class="skel w2"></div><div class="skel w3"></div><div class="skel w4"></div>`;
        } else {
          body = `<div class="card error">
            <h3>Couldn't load this body</h3>
            <p>Message headers are here. Retry to fetch the body.</p>
            <button class="primary" type="button" data-recover="unavailable">Retry</button>
          </div>`;
        }
      } else if (st === "offline") {
        if (variant === "C") {
          body = `<div class="placeholder">Body isn't on this device.
            <button class="linkish" type="button" data-recover="offline">Get body</button></div>`;
        } else {
          body = `<div class="card">
            <h3>Body isn't on this device</h3>
            <p>Headers are kept locally. Get the body to read this Message.</p>
            <button class="primary" type="button" data-recover="offline">Get body</button>
          </div>`;
        }
      }
      return `<article class="msg">
        <div class="msg-head">
          <span class="${avClass}">${esc(initial)}</span>
          <div>
            <div class="msg-from">${esc(m.from)}</div>
            <div class="msg-meta">${esc(m.when)} · to you</div>
          </div>
        </div>
        ${body}
      </article>`;
    }

    function renderReading() {
      const sel = selectedIndex();
      const t = sel == null ? null : THREADS[sel];
      const takeover = document.getElementById("takeover");
      takeover.className = "takeover";
      takeover.innerHTML = "";
      if (!t) {
        document.getElementById("read-thread").innerHTML = "";
        return;
      }
      const states = t.messages.map(msgState);
      const hasUnavail = states.includes("unavailable");
      const hasOff = states.includes("offline");
      const takeoverOn = variant === "B" && (hasUnavail || hasOff);
      app.dataset.takeover = takeoverOn ? "1" : "0";
      if (takeoverOn) {
        if (hasUnavail) {
          takeover.classList.add("error");
          takeover.innerHTML = `
            ${WARN}
            <h2>Couldn't load this body</h2>
            <p>Invoice 1842 is selected. Thread chrome is hidden in this variant until the body returns.</p>
            <div class="acts">
              <button class="primary" type="button" data-recover="unavailable">Retry</button>
              <button class="ghost" type="button" data-sync>Sync</button>
            </div>`;
        } else {
          takeover.innerHTML = `
            ${CLOUD}
            <h2>Download to read</h2>
            <p>Only headers are on this device. Get the body to open Offsite itinerary.</p>
            <div class="acts">
              <button class="primary" type="button" data-recover="offline">Get body</button>
            </div>`;
        }
        document.getElementById("read-thread").innerHTML = "";
        return;
      }

      const people = (t.participants || []).map(p => `<span class="chip-person">${esc(p)}</span>`).join("");
      const attach = (t.attachments || []).map(a =>
        `<span class="strip-item">${FILE}${esc(a.name)} · ${esc(a.size)}</span>`
      ).join("");
      let bar = "";
      if (variant === "C" && hasUnavail) {
        bar = `<div class="infobar"><span>Couldn't load this body</span>
          <button class="linkish" type="button" data-recover="unavailable">Retry</button></div>`;
      } else if (variant === "C" && hasOff) {
        bar = `<div class="infobar warn"><span>Body isn't on this device</span>
          <button class="linkish" type="button" data-recover="offline">Get body</button></div>`;
      }
      document.getElementById("read-thread").innerHTML = `
        <div class="thread-head">
          <div class="head-text">
            <h2>${esc(t.subject)}</h2>
            <div class="sub">${esc(t.from)} · you</div>
            <div class="people">${people}</div>
          </div>
          <button class="more" type="button" aria-label="Thread commands">${DOTS}</button>
        </div>
        ${attach ? `<div class="strip-attach">${attach}</div>` : ""}
        ${bar}
        ${t.messages.map(m => renderMessage(m)).join("")}`;
    }

    function paintState() {
      const s = sceneDef();
      const v = VARIANTS.find(x => x.key === variant);
      document.getElementById("vlabel").textContent = v.key + " — " + v.name;
      document.getElementById("state").textContent =
        `scene=${scene} emptyList=${emptyList()} sel=${selectedIndex()} recovered=${JSON.stringify(recovered)} last=${lastAction}`;
      sceneSel.value = scene;
    }

    function render() {
      const s = sceneDef();
      app.dataset.variant = variant;
      app.dataset.emptyList = emptyList() ? "1" : "0";
      app.dataset.surface = (!emptyList() && selectedIndex() != null) ? "reading" : "empty";
      const takeover = variant === "B" && (scene === "unavailable" && !recovered.unavailable || scene === "offline" && !recovered.offline);
      app.dataset.takeover = takeover ? "1" : "0";
      renderNav();
      renderList();
      renderWell();
      renderReadEmpty();
      renderReading();
      paintState();
      writeUrl();
    }

    function cycle(dir) {
      const i = VARIANTS.findIndex(v => v.key === variant);
      variant = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key;
      lastAction = "variant " + variant;
      render();
    }

    function setScene(key) {
      scene = key;
      selectedOverride = null;
      recovered = { unavailable: false, offline: false };
      lastAction = "scene " + key;
      render();
    }

    document.getElementById("prev").onclick = () => cycle(-1);
    document.getElementById("next").onclick = () => cycle(1);
    sceneSel.onchange = () => setScene(sceneSel.value);

    document.addEventListener("keydown", (e) => {
      if (e.target.closest("input, textarea, [contenteditable], select")) return;
      if (e.key === "ArrowLeft") cycle(-1);
      if (e.key === "ArrowRight") cycle(1);
    });

    app.addEventListener("click", (e) => {
      const navBtn = e.target.closest("[data-nav]");
      if (navBtn) {
        const n = navBtn.getAttribute("data-nav");
        if (n === "unified") setScene(emptyList() ? "unified" : "noselect");
        else if (n.endsWith("/outbox")) setScene("outbox");
        else if (n.endsWith("/sent") || n.endsWith("/drafts")) setScene("mailbox");
        else setScene("noselect");
        return;
      }
      const th = e.target.closest(".thread");
      if (th) {
        const i = Number(th.dataset.i);
        if (i === 1) { setScene("unavailable"); return; }
        if (i === 2) { setScene("offline"); return; }
        scene = "noselect";
        selectedOverride = i;
        lastAction = "select Thread " + i;
        render();
        return;
      }
      if (e.target.closest("[data-compose], [data-act='compose']")) {
        lastAction = "Compose";
        showToast("Compose replaces reading — not this ticket");
        paintState();
        return;
      }
      if (e.target.closest("[data-sync], [data-act='sync']")) {
        lastAction = "Sync";
        showToast(sceneDef().nav === "unified" ? "Sync all Accounts" : "Sync selected Account");
        paintState();
        return;
      }
      if (e.target.closest("[data-add]")) {
        showToast("Add Account — zero-Accounts already locked");
        return;
      }
      const rec = e.target.closest("[data-recover]");
      if (rec) {
        const kind = rec.getAttribute("data-recover");
        recovered[kind] = true;
        lastAction = "recover " + kind;
        showToast(kind === "offline" ? "Body is now local" : "Body fetched");
        render();
      }
    });

    render();
  </script>
</body>
</html>
