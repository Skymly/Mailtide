<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Compose-in-pane, local Drafts, and Outbox</title>
  <!--
    PROTOTYPE — throwaway. Not product UI.
    Question: When compose replaces the reading pane, how do local Draft
    switching, Send/discard, and the per-Account Outbox nav item work
    without becoming a button farm again?
    Three variants, switchable via ?variant=A|B|C.
    A — Header menu / footer pair  (lock #214)
    B — In-pane rail / hover verbs
    C — Chip tabs / context only
  -->
  <style>
    :root {
      --text: rgba(0, 0, 0, .9);
      --text-2: rgba(0, 0, 0, .61);
      --text-3: rgba(0, 0, 0, .45);
      --accent: #005fb8;
      --accent-hover: #005ba1;
      --accent-text: #fff;
      --bg: #f3f3f3;
      --layer: #fff;
      --nav: #f7f7f7;
      --stroke: rgba(0, 0, 0, .08);
      --hover: rgba(0, 0, 0, .045);
      --pressed: rgba(0, 0, 0, .07);
      --selected: #cfe4fa;
      --error: #c42b1c;
      --badge: #005fb8;
      --focus: #005fb8;
      --ok: #0f7b0f;
      --shadow: 0 8px 24px rgba(0, 0, 0, .18);
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      --nav-w: 260px;
      --list-w: 340px;
      --row: 28px;
      --bar: 40px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: rgba(255, 255, 255, .95);
        --text-2: rgba(255, 255, 255, .7);
        --text-3: rgba(255, 255, 255, .5);
        --accent: #60cdff;
        --accent-hover: #99ebff;
        --accent-text: #000;
        --bg: #202020;
        --layer: #2c2c2c;
        --nav: #272727;
        --stroke: rgba(255, 255, 255, .08);
        --hover: rgba(255, 255, 255, .06);
        --pressed: rgba(255, 255, 255, .08);
        --selected: #1a3d5c;
        --error: #ff99a4;
        --badge: #60cdff;
        --focus: #60cdff;
        --ok: #6ccb5f;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 13px/1.3 var(--font);
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app { display: flex; flex-direction: column; height: 100%; }

    .commandbar {
      display: flex; align-items: center; gap: 4px;
      height: var(--bar); padding: 0 8px;
      background: var(--layer); border-bottom: 1px solid var(--stroke); flex-shrink: 0;
    }
    .cmd {
      display: inline-flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 10px; border: 0; border-radius: 4px; background: transparent;
    }
    .cmd:hover { background: var(--hover); }
    .cmd svg { width: 16px; height: 16px; fill: currentColor; }
    .cmd.accent { background: var(--accent); color: var(--accent-text); }
    .cmd.accent:hover { background: var(--accent-hover); }
    .more {
      width: 32px; height: 32px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 0; border-radius: 4px; background: transparent; color: var(--text-2);
    }
    .more:hover { background: var(--hover); color: var(--text); }
    .more svg { width: 16px; height: 16px; fill: currentColor; }

    .shell {
      display: grid;
      grid-template-columns: var(--nav-w) 1px var(--list-w) 1px minmax(0, 1fr);
      flex: 1; min-height: 0;
    }
    .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
    .split { background: var(--stroke); }

    .nav { background: var(--nav); padding: 6px 6px 0; }
    .nav-scroll { overflow: auto; flex: 1; }
    .tree-item, .tree-child, .tree-account {
      display: flex; align-items: center; gap: 8px;
      height: var(--row); padding: 0 8px; border: 0; border-radius: 4px;
      background: transparent; width: 100%; text-align: left;
    }
    .tree-item:hover, .tree-child:hover { background: var(--hover); }
    .tree-item[aria-selected="true"], .tree-child[aria-selected="true"] { background: var(--selected); }
    .tree-item svg, .tree-child svg, .tree-account svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
    .tree-item.unified { font-weight: 600; margin-bottom: 4px; }
    .chev { width: 10px; height: 10px; opacity: .65; }
    .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { color: var(--text-2); font-size: 12px; }
    .badge {
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--badge); color: var(--accent-text);
      font-size: 11px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .badge.off { background: transparent; color: transparent; min-width: 0; padding: 0; }
    .account-block { margin: 2px 0 6px; }
    .tree-child { padding-left: 34px; }
    .tree-child.outbox { color: var(--text); }
    .nav-note {
      margin: 0 8px 8px 34px; font-size: 11px; color: var(--text-3); line-height: 1.3;
    }
    .nav-footer { border-top: 1px solid var(--stroke); padding: 6px 0; }
    .add-account {
      display: flex; align-items: center; gap: 8px;
      height: 32px; width: 100%; padding: 0 8px;
      border: 0; border-radius: 4px; background: transparent; color: var(--accent);
    }
    .add-account:hover { background: var(--hover); }
    .add-account svg { width: 16px; height: 16px; }

    .list, .reading { background: var(--layer); }
    .list-header {
      display: flex; align-items: center; gap: 8px;
      min-height: 48px; padding: 8px;
      border-bottom: 1px solid var(--stroke); flex-shrink: 0;
    }
    .scope { font-size: 12px; color: var(--text-2); white-space: nowrap; }
    .search {
      flex: 1; display: flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 10px;
      border: 1px solid var(--stroke); border-radius: 4px; background: var(--bg);
    }
    .search svg { width: 14px; height: 14px; fill: var(--text-3); }
    .search input { flex: 1; border: 0; background: transparent; outline: none; min-width: 0; }
    .threads { overflow: auto; flex: 1; padding: 4px; }
    .caption {
      margin: 4px 8px 8px; padding: 6px 8px;
      font-size: 11px; color: var(--text-2); background: var(--bg);
      border-radius: 4px; border: 1px dashed var(--stroke);
    }

    .thread, .obox, .sdraft {
      width: 100%; text-align: left; border: 0; border-radius: 4px;
      background: transparent; color: inherit; padding: 6px 8px;
    }
    .thread:hover, .obox:hover, .sdraft:hover { background: var(--hover); }
    .thread[aria-selected="true"], .obox[aria-selected="true"], .sdraft[aria-selected="true"] { background: var(--selected); }
    .row-a {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) auto;
      column-gap: 8px; row-gap: 1px;
      min-height: 56px; align-items: center;
    }
    .pip { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .pip.off { background: transparent; }
    .pip.fail { background: var(--error); }
    .pip.queue { background: var(--ok); }
    .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .when { color: var(--text-2); font-size: 12px; white-space: nowrap; }
    .from-line { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .unread .from { font-weight: 600; }
    .subject { color: var(--text-2); }
    .unread .subject { color: var(--text); }
    .preview-line { color: var(--text-3); font-size: 12px; display: flex; align-items: center; gap: 6px; min-width: 0; }
    .stchip {
      font-size: 10px; padding: 0 5px; height: 16px; border-radius: 3px;
      display: inline-flex; align-items: center; flex-shrink: 0;
      border: 1px solid var(--stroke); color: var(--text-2);
    }
    .stchip.fail { color: var(--error); border-color: var(--error); }
    .hover-acts {
      display: none; gap: 4px; flex-shrink: 0;
    }
    .app[data-variant="B"] .obox:hover .hover-acts,
    .app[data-variant="B"] .obox[aria-selected="true"] .hover-acts { display: inline-flex; }
    .hover-acts button {
      height: 22px; padding: 0 8px; border: 1px solid var(--stroke);
      border-radius: 4px; background: var(--layer); font-size: 11px;
    }
    .hover-acts button:hover { background: var(--hover); }

    .read-empty, .read-thread, .compose, .outbox-pane {
      display: none; flex-direction: column; min-height: 0; height: 100%;
    }
    .compose, .outbox-pane { padding-bottom: 64px; }
    .app[data-surface="empty"] .read-empty { display: flex; }
    .app[data-surface="reading"] .read-thread { display: flex; }
    .app[data-surface="compose"] .compose { display: flex; }
    .app[data-surface="outbox"] .outbox-pane { display: flex; }
    .read-empty {
      align-items: center; justify-content: center;
      color: var(--text-3); gap: 8px;
    }
    .read-empty svg { width: 40px; height: 40px; fill: currentColor; }
    .read-thread { overflow: auto; }
    .thread-head {
      position: sticky; top: 0; z-index: 2;
      display: flex; align-items: flex-start; gap: 8px;
      padding: 12px 16px; background: var(--layer);
      border-bottom: 1px solid var(--stroke);
    }
    .thread-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
    .head-text { flex: 1; min-width: 0; }
    .sub { color: var(--text-2); font-size: 12px; margin-top: 2px; }
    .msg { padding: 14px 16px 16px; border-bottom: 1px solid var(--stroke); }
    .msg-from { font-weight: 600; }
    .msg-meta { color: var(--text-2); font-size: 12px; margin-top: 2px; margin-bottom: 8px; }
    .msg p { margin: 0 0 8px; max-width: 62ch; }

    .compose { min-height: 0; }
    .app[data-variant="B"][data-surface="compose"] .compose {
      display: grid; grid-template-columns: 168px minmax(0, 1fr); grid-template-rows: 1fr;
    }
    .rail {
      display: none; flex-direction: column; min-height: 0;
      border-right: 1px solid var(--stroke); background: var(--nav);
    }
    .app[data-variant="B"] .rail { display: flex; }
    .rail h3 {
      margin: 0; padding: 10px 10px 6px; font-size: 11px; font-weight: 600;
      color: var(--text-2); text-transform: uppercase; letter-spacing: .04em;
    }
    .rail-note { padding: 0 10px 8px; font-size: 11px; color: var(--text-3); }
    .rail-list { overflow: auto; flex: 1; padding: 0 6px 6px; }
    .rail-card {
      position: relative; width: 100%; text-align: left;
      padding: 8px 24px 8px 8px; margin-bottom: 4px;
      border: 0; border-radius: 4px; background: transparent; color: inherit;
    }
    .rail-card:hover { background: var(--hover); }
    .rail-card.on { background: var(--selected); }
    .rail-card .t { font-weight: 600; }
    .rail-card .s { font-size: 11px; color: var(--text-2); }
    .rail-x {
      position: absolute; top: 4px; right: 4px;
      width: 20px; height: 20px; border: 0; border-radius: 4px;
      background: transparent; color: var(--text-3);
    }
    .rail-x:hover { background: var(--pressed); color: var(--text); }

    .form { display: flex; flex-direction: column; min-height: 0; min-width: 0; flex: 1; height: 100%; }
    .chips-row {
      display: none; align-items: center; gap: 6px;
      padding: 8px 12px; border-bottom: 1px solid var(--stroke);
      overflow-x: auto; flex-shrink: 0;
    }
    .app[data-variant="C"] .chips-row { display: flex; }
    .dchip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 26px; padding: 0 6px 0 10px;
      border: 1px solid var(--stroke); border-radius: 4px;
      background: var(--bg); max-width: 180px; flex-shrink: 0;
    }
    .dchip.on { background: var(--selected); border-color: transparent; }
    .dchip button.pick {
      border: 0; background: transparent; padding: 0; max-width: 140px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .dchip .x {
      width: 18px; height: 18px; border: 0; border-radius: 4px;
      background: transparent; color: var(--text-3); padding: 0;
    }
    .dchip .x:hover { background: var(--pressed); color: var(--text); }

    .compose-head {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-bottom: 1px solid var(--stroke); flex-shrink: 0;
    }
    .dd { position: relative; }
    .dd-btn {
      height: 28px; padding: 0 10px; border: 1px solid var(--stroke);
      border-radius: 4px; background: var(--bg); display: inline-flex; align-items: center; gap: 6px;
    }
    .dd-btn:hover { background: var(--hover); }
    .dd-menu {
      display: none; position: absolute; top: calc(100% + 4px); left: 0; z-index: 8;
      min-width: 280px; max-width: 360px;
      padding: 4px; background: var(--layer); border: 1px solid var(--stroke);
      border-radius: 8px; box-shadow: var(--shadow);
    }
    .dd.open .dd-menu { display: block; }
    .dd-item {
      display: block; width: 100%; text-align: left; border: 0;
      background: transparent; padding: 8px 10px; border-radius: 4px;
    }
    .dd-item:hover { background: var(--hover); }
    .dd-item.on { background: var(--selected); }
    .dd-item .t { font-weight: 600; }
    .dd-item .s { font-size: 11px; color: var(--text-2); }
    .dd-foot { padding: 6px 10px; font-size: 11px; color: var(--text-3); border-top: 1px solid var(--stroke); margin-top: 4px; }
    .compose-row {
      display: flex; align-items: center; gap: 8px;
      padding: 0 12px; border-bottom: 1px solid var(--stroke); flex-shrink: 0;
    }
    .compose-row label { color: var(--text-2); width: 56px; flex-shrink: 0; }
    .compose-row input, .compose-row select {
      flex: 1; border: 0; background: transparent; outline: none; padding: 8px 0; min-width: 0;
    }
    .form textarea {
      flex: 1; border: 0; background: transparent; outline: none;
      padding: 12px; resize: none; min-height: 80px;
    }
    .compose-actions {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 12px; border-top: 1px solid var(--stroke); flex-shrink: 0;
    }
    .hint { margin-left: auto; font-size: 11px; color: var(--text-3); }
    .primary {
      height: 32px; padding: 0 14px; border: 0; border-radius: 4px;
      background: var(--accent); color: var(--accent-text);
    }
    .ghost {
      height: 32px; padding: 0 14px; border: 1px solid var(--stroke);
      border-radius: 4px; background: transparent;
    }
    .app[data-variant="A"] .head-send,
    .app[data-variant="B"] .head-send,
    .app[data-variant="C"] .foot-discard { display: none; }
    .app[data-variant="C"] .compose-actions { display: none; }
    .app[data-variant="A"] .dd-drafts { display: inline-flex; }
    .app[data-variant="B"] .dd-drafts,
    .app[data-variant="C"] .dd-drafts { display: none; }

    .outbox-pane { overflow: auto; }
    .status-card { padding: 20px 24px; }
    .status-card h2 { margin: 0 0 8px; font-size: 18px; }
    .status-big {
      display: inline-flex; align-items: center; gap: 8px;
      font-size: 13px; font-weight: 600; margin-bottom: 12px;
    }
    .status-big.fail { color: var(--error); }
    .status-big.queue { color: var(--ok); }
    .kv { display: grid; grid-template-columns: 72px 1fr; gap: 6px 12px; color: var(--text-2); max-width: 52ch; }
    .kv b { color: var(--text); font-weight: 600; }
    .timeline { margin: 16px 0 0; padding: 0; list-style: none; color: var(--text-2); font-size: 12px; }
    .timeline li { padding: 4px 0 4px 12px; border-left: 2px solid var(--stroke); }
    .inspector-acts { display: flex; gap: 8px; margin-top: 16px; }
    .app[data-variant="C"] .inspector-acts { display: none; }
    .app[data-variant="A"] .status-card .inspector-acts { display: none; }

    .ctx {
      display: none; position: fixed; z-index: 20; min-width: 196px;
      padding: 4px; background: var(--layer); border: 1px solid var(--stroke);
      border-radius: 8px; box-shadow: var(--shadow);
    }
    .ctx button {
      display: block; width: 100%; text-align: left; border: 0;
      background: transparent; padding: 6px 10px; border-radius: 4px;
    }
    .ctx button:hover { background: var(--hover); }
    .ctx .sep { height: 1px; background: var(--stroke); margin: 4px 6px; }
    .toast {
      position: fixed; right: 16px; bottom: 64px; z-index: 40;
      display: none; padding: 10px 14px; background: var(--layer);
      border: 1px solid var(--stroke); border-radius: 8px; box-shadow: var(--shadow);
    }
    .switcher {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px; background: #111; color: #fff;
      box-shadow: var(--shadow);
      font: 12px/1.2 ui-monospace, Consolas, monospace;
      user-select: none;
    }
    .switcher button {
      width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: #333; color: #fff;
    }
    .switcher button:hover { background: #444; }
    .switcher .vlabel { min-width: 280px; text-align: center; }
    .switcher .tog { width: auto; padding: 0 10px; border-radius: 999px; }
    .switcher .state { color: #9ad; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="app" data-variant="A" data-surface="reading">
    <div class="commandbar">
      <button class="cmd accent" data-compose type="button">
        <svg viewBox="0 0 16 16"><path d="M2 13.5V11l7.4-7.4 2.5 2.5L4.5 13.5H2zm9.1-9.1.9-.9a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1 0 1.4l-.9.9-2.5-2.5z"/></svg>
        Compose
      </button>
      <button class="cmd" data-sync type="button">
        <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 5.3 3.2l-1.3.8A4.5 4.5 0 1 1 8 3.5V6l3-2.5L8 1v1z"/></svg>
        Sync
      </button>
    </div>

    <div class="shell">
      <nav class="pane nav">
        <div class="nav-scroll">
          <button class="tree-item unified" data-nav="unified" aria-selected="true" type="button">
            <svg viewBox="0 0 16 16"><path d="M1 3.5 8 1l7 2.5v9L8 15 1 12.5v-9zM8 2.2 2.2 4.2v7.6L8 13.8l5.8-2V4.2L8 2.2z"/></svg>
            <span class="label">Unified Inbox</span>
            <span class="count">4</span>
          </button>
          <div class="account-block">
            <div class="tree-account">
              <svg class="chev" viewBox="0 0 12 12"><path d="M3 2l6 4-6 4z"/></svg>
              <span class="label">Personal</span>
            </div>
            <button class="tree-child" data-nav="personal/inbox" type="button"><span class="label">Inbox</span><span class="count">3</span></button>
            <button class="tree-child" data-nav="personal/sent" type="button"><span class="label">Sent</span></button>
            <button class="tree-child" data-nav="personal/drafts" type="button"><span class="label">Drafts</span><span class="count">1</span></button>
            <button class="tree-child" data-nav="personal/trash" type="button"><span class="label">Trash</span></button>
            <button class="tree-child outbox" data-nav="personal/outbox" type="button">
              <svg viewBox="0 0 16 16"><path d="M2 3h12v3l-6 3-6-3V3zm0 5.2 6 3 6-3V13H2V8.2z"/></svg>
              <span class="label">Outbox</span>
              <span class="badge" data-badge="personal">2</span>
            </button>
          </div>
          <div class="account-block">
            <div class="tree-account">
              <svg class="chev" viewBox="0 0 12 12"><path d="M3 2l6 4-6 4z"/></svg>
              <span class="label">Work</span>
            </div>
            <button class="tree-child" data-nav="work/inbox" type="button"><span class="label">Inbox</span><span class="count">1</span></button>
            <button class="tree-child" data-nav="work/sent" type="button"><span class="label">Sent</span></button>
            <button class="tree-child outbox" data-nav="work/outbox" type="button">
              <svg viewBox="0 0 16 16"><path d="M2 3h12v3l-6 3-6-3V3zm0 5.2 6 3 6-3V13H2V8.2z"/></svg>
              <span class="label">Outbox</span>
              <span class="badge off" data-badge="work"></span>
            </button>
          </div>
          <p class="nav-note">Outbox is always present, not a Mailbox. Local Drafts are not in this tree.</p>
        </div>
        <div class="nav-footer">
          <button class="add-account" type="button" data-add>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
            Add Account
          </button>
        </div>
      </nav>
      <div class="split"></div>

      <section class="pane list">
        <div class="list-header">
          <span class="scope" data-scope>Unified Inbox</span>
          <label class="search">
            <svg viewBox="0 0 16 16"><path d="M7 2a5 5 0 1 1 3.4 8.6l2.8 2.8-.7.7-2.8-2.8A5 5 0 0 1 7 2zm0 1.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z"/></svg>
            <input placeholder="Search  is:unread  is:flagged" />
          </label>
        </div>
        <div class="threads" id="threads"></div>
      </section>
      <div class="split"></div>

      <section class="pane reading">
        <div class="read-empty">
          <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v.8l7 4.2 7-4.2V7H5zm0 3.3V17h14V10.3l-7 4.2-7-4.2z"/></svg>
          <span data-empty-label>Select a Thread</span>
        </div>
        <div class="read-thread" id="read-thread"></div>
        <div class="compose" id="compose"></div>
        <div class="outbox-pane" id="outbox-pane"></div>
      </section>
    </div>
  </div>

  <div class="ctx" id="ctx" role="menu"></div>
  <div class="toast" id="toast"></div>

  <div class="switcher" id="switcher">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <div class="vlabel" id="vlabel">A — Header menu / footer pair</div>
    <button type="button" id="next" aria-label="Next variant">→</button>
    <button class="tog" type="button" id="reset">Reset seed</button>
    <div class="state" id="state"></div>
  </div>

  <script>
    const VARIANTS = [
      { key: "A", name: "Header menu / footer pair" },
      { key: "B", name: "In-pane rail / hover verbs" },
      { key: "C", name: "Chip tabs / context only" },
    ];
    const ACCOUNTS = [
      { id: "personal", name: "Personal", email: "me@home.example" },
      { id: "work", name: "Work", email: "me@work.example" },
    ];
    const SCOPES = {
      unified: "Unified Inbox",
      "personal/inbox": "Inbox · Personal",
      "personal/sent": "Sent · Personal",
      "personal/drafts": "Drafts · Personal",
      "personal/trash": "Trash · Personal",
      "personal/outbox": "Outbox · Personal",
      "work/inbox": "Inbox · Work",
      "work/sent": "Sent · Work",
      "work/outbox": "Outbox · Work",
    };
    const THREADS = [
      { from: "Alex Chen", subject: "Q3 planning notes", when: "9:14 AM", unread: true, preview: "Can we lock the Fluent shell before tickets?", body: "Can we lock the Fluent shell before we start tickets? I want the daily surface to feel like mail." },
      { from: "Jordan Lee", subject: "Invoice 1842", when: "Yesterday", unread: true, preview: "Invoice attached.", body: "Invoice attached. Paying from Work." },
      { from: "Samira", subject: "Re: weekend hike", when: "Mon", unread: false, preview: "Leaving at 7.", body: "Leaving at 7. I'll bring the extra water filter." },
      { from: "GitHub", subject: "[Mailtide] CI passed on main", when: "Sun", unread: false, preview: "All checks were successful.", body: "All 142 checks were successful." },
    ];
    const SERVER_DRAFTS = [
      { from: "You", subject: "Notes from last week (server)", when: "Tue", preview: "Lives in the Drafts-role Mailbox.", body: "This Message is in the Drafts-role Mailbox. It is not a local Draft. Opening it does not enter compose." },
    ];

    function seedDrafts() {
      return [
        { id: 1, account: "personal", to: "alex@example.com", cc: "", subject: "Q3 planning follow-up", body: "Locking the Fluent shell before tickets.", created: "9:40 AM" },
        { id: 2, account: "work", to: "finance@work.example", cc: "", subject: "Invoice 1842 received", body: "", created: "Yesterday" },
        { id: 3, account: "personal", to: "samira@example.com", cc: "", subject: "Re: weekend hike", body: "I can do 7am. Bringing the extra filter.", created: "Mon" },
      ];
    }
    function seedOutbox() {
      return [
        { id: 1, account: "personal", to: "vendor@example.com", subject: "PO confirmation", body: "Please confirm PO-441.", status: "queued", error: "", when: "9:12 AM" },
        { id: 2, account: "personal", to: "jordan@example.com", subject: "Re: Invoice 1842", body: "Got it, paying Friday.", status: "failed", error: "SMTP 550 mailbox unavailable", when: "8:58 AM" },
      ];
    }

    const app = document.querySelector(".app");
    const params = new URLSearchParams(location.search);
    let variant = (params.get("variant") || "A").toUpperCase();
    if (!VARIANTS.some(v => v.key === variant)) variant = "A";
    let nav = "unified";
    let thread = 0;
    let surface = "reading";
    let drafts = seedDrafts();
    let outbox = seedOutbox();
    let draftId = 1;
    let outboxId = 1;
    let nextDraft = 4;
    let nextOutbox = 3;
    let serverDraft = 0;
    let menuOpen = false;
    let lastAction = "load";
    let syncing = false;

    const threadsEl = document.getElementById("threads");
    const readEl = document.getElementById("read-thread");
    const composeEl = document.getElementById("compose");
    const outboxEl = document.getElementById("outbox-pane");
    const ctx = document.getElementById("ctx");
    const toast = document.getElementById("toast");

    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }
    function accountName(id) {
      const a = ACCOUNTS.find(x => x.id === id);
      return a ? a.name : id;
    }
    function currentDraft() { return drafts.find(d => d.id === draftId); }
    function outboxFor(account) { return outbox.filter(o => o.account === account); }
    function selectedOutbox() { return outbox.find(o => o.id === outboxId); }
    function navAccount() {
      if (nav.startsWith("work")) return "work";
      return "personal";
    }
    function isEmptyDraft(d) {
      return !d.to.trim() && !d.cc.trim() && !d.subject.trim() && !d.body.trim();
    }
    function titleOf(d) { return d.subject.trim() || d.to.trim() || "Untitled Draft"; }
    function hideMenu() { ctx.style.display = "none"; }

    function writeUrl() {
      history.replaceState(null, "", "?variant=" + variant);
    }

    function showToast(text) {
      lastAction = text;
      toast.textContent = text;
      toast.style.display = "block";
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => { toast.style.display = "none"; }, 1800);
      paintState();
    }

    function paintState() {
      const d = currentDraft();
      document.getElementById("state").textContent =
        `nav=${nav} surface=${surface} drafts=${drafts.length} draft=${d ? d.id : "-"} outbox=${outbox.length} last=${lastAction}`;
    }

    function pruneEmptyExcept(keepId) {
      drafts = drafts.filter(d => d.id === keepId || !isEmptyDraft(d));
    }

    function newDraft(partial) {
      pruneEmptyExcept(null);
      const d = {
        id: nextDraft++,
        account: partial.account || navAccount(),
        to: partial.to || "",
        cc: partial.cc || "",
        subject: partial.subject || "",
        body: partial.body || "",
        created: "now",
      };
      drafts.unshift(d);
      draftId = d.id;
      surface = "compose";
      menuOpen = false;
      lastAction = "new local Draft " + d.id;
    }

    function leaveCompose() {
      pruneEmptyExcept(null);
      menuOpen = false;
    }

    function sendCurrent() {
      const d = currentDraft();
      if (!d) return;
      if (!d.to.trim()) { showToast("To is empty"); return; }
      outbox.unshift({
        id: nextOutbox++,
        account: d.account,
        to: d.to,
        subject: d.subject || "(no subject)",
        body: d.body,
        status: "queued",
        error: "",
        when: "now",
      });
      drafts = drafts.filter(x => x.id !== d.id);
      draftId = drafts[0] ? drafts[0].id : null;
      if (draftId) {
        surface = "compose";
        showToast("Queued to " + accountName(d.account) + " Outbox · next Draft still open");
      } else {
        surface = "reading";
        showToast("Queued to " + accountName(d.account) + " Outbox · flushes with Sync");
      }
    }

    function discardDraft(id) {
      drafts = drafts.filter(d => d.id !== id);
      if (draftId === id) draftId = drafts[0] ? drafts[0].id : null;
      if (!draftId) surface = "reading";
      menuOpen = false;
      showToast("Discarded local Draft");
    }

    function retryOutbox(id) {
      const o = outbox.find(x => x.id === id);
      if (!o) return;
      o.status = "queued";
      o.error = "";
      showToast("Retry queued · flushes with Sync");
    }

    function discardOutbox(id) {
      outbox = outbox.filter(x => x.id !== id);
      if (outboxId === id) {
        const rest = outboxFor(navAccount());
        outboxId = rest[0] ? rest[0].id : null;
      }
      if (!outboxId) surface = "empty";
      else surface = "outbox";
      showToast("Discarded Outbox Message");
    }

    function flushOutbox() {
      const scope = nav === "unified" ? null : navAccount();
      const before = outbox.length;
      outbox = outbox.filter(o => {
        if (o.status !== "queued") return true;
        if (scope && o.account !== scope) return true;
        return false;
      });
      const n = before - outbox.length;
      showToast(n ? ("Flushed " + n + " queued · failed stay until Retry") : "Nothing queued to flush");
    }

    function moreSvg() {
      return `<svg viewBox="0 0 16 16"><circle cx="3.5" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.5" cy="8" r="1.3"/></svg>`;
    }

    function renderNav() {
      document.querySelectorAll("[data-nav]").forEach(el => {
        el.setAttribute("aria-selected", el.getAttribute("data-nav") === nav ? "true" : "false");
      });
      ACCOUNTS.forEach(a => {
        const n = outboxFor(a.id).length;
        const b = document.querySelector('[data-badge="' + a.id + '"]');
        if (!b) return;
        b.textContent = n ? String(n) : "";
        b.classList.toggle("off", !n);
      });
    }

    function renderList() {
      document.querySelector("[data-scope]").textContent = SCOPES[nav] || nav;
      if (nav.endsWith("/outbox")) {
        const items = outboxFor(nav.split("/")[0]);
        const cap = `<div class="caption">Outbox is the send queue for this Account — not a Mailbox, not local Drafts. Retry/Discard live on the item.</div>`;
        if (!items.length) {
          threadsEl.innerHTML = cap + `<div class="caption">Empty. Send a Draft to queue one. Sync flushes queued.</div>`;
          return;
        }
        threadsEl.innerHTML = cap + items.map(o => {
          const fail = o.status === "failed";
          const hover = fail
            ? `<button type="button" data-retry="${o.id}">Retry</button><button type="button" data-odiscard="${o.id}">Discard</button>`
            : `<button type="button" data-odiscard="${o.id}">Discard</button>`;
          return `<button class="obox" data-oid="${o.id}" aria-selected="${o.id === outboxId}" type="button">
            <div class="row-a">
              <span class="pip ${fail ? "fail" : "queue"}"></span>
              <span class="from-line"><span class="from ellipsis">${esc(o.to)}</span><span class="stchip ${fail ? "fail" : ""}">${fail ? "Failed" : "Queued"}</span></span>
              <span class="when">${esc(o.when)}</span>
              <span class="subject ellipsis" style="grid-column:2/-1">${esc(o.subject)}</span>
              <span class="preview-line" style="grid-column:2/-1">
                <span class="ellipsis">${fail ? esc(o.error) : "Waiting for Sync"}</span>
                <span class="hover-acts">${hover}</span>
              </span>
            </div>
          </button>`;
        }).join("");
        return;
      }
      if (nav.endsWith("/drafts")) {
        threadsEl.innerHTML = `<div class="caption">Drafts-role Mailbox (IMAP). These are not local Drafts. Local Draft switching lives only inside compose.</div>` +
          SERVER_DRAFTS.map((t, i) => `
          <button class="sdraft ${i === serverDraft ? "" : ""}" data-si="${i}" aria-selected="${i === serverDraft}" type="button">
            <div class="row-a">
              <span class="pip off"></span>
              <span class="from-line"><span class="from ellipsis">${esc(t.from)}</span></span>
              <span class="when">${esc(t.when)}</span>
              <span class="subject ellipsis" style="grid-column:2/-1">${esc(t.subject)}</span>
              <span class="preview-line ellipsis" style="grid-column:2/-1">${esc(t.preview)}</span>
            </div>
          </button>`).join("");
        return;
      }
      threadsEl.innerHTML = THREADS.map((t, i) => `
        <button class="thread${t.unread ? " unread" : ""}" data-i="${i}" aria-selected="${i === thread}" type="button">
          <div class="row-a">
            <span class="pip${t.unread ? "" : " off"}"></span>
            <span class="from-line"><span class="from ellipsis">${esc(t.from)}</span></span>
            <span class="when">${esc(t.when)}</span>
            <span class="subject ellipsis" style="grid-column:2/-1">${esc(t.subject)}</span>
            <span class="preview-line ellipsis" style="grid-column:2/-1">${esc(t.preview)}</span>
          </div>
        </button>`).join("");
    }

    function renderReading() {
      if (nav.endsWith("/drafts")) {
        const t = SERVER_DRAFTS[serverDraft] || SERVER_DRAFTS[0];
        readEl.innerHTML = t ? `
          <div class="thread-head">
            <div class="head-text">
              <h2>${esc(t.subject)}</h2>
              <div class="sub">Drafts-role Mailbox · not a local Draft</div>
            </div>
          </div>
          <article class="msg">
            <div class="msg-from">${esc(t.from)}</div>
            <div class="msg-meta">${esc(t.when)}</div>
            <p>${esc(t.body)}</p>
          </article>` : "";
        return;
      }
      const t = THREADS[thread];
      if (!t) { readEl.innerHTML = ""; return; }
      readEl.innerHTML = `
        <div class="thread-head">
          <div class="head-text">
            <h2>${esc(t.subject)}</h2>
            <div class="sub">${esc(t.from)} · you</div>
          </div>
          <button class="more" type="button" data-more="thread" aria-label="Thread commands">${moreSvg()}</button>
        </div>
        <article class="msg">
          <div class="msg-from">${esc(t.from)}</div>
          <div class="msg-meta">${esc(t.when)} · to you</div>
          <p>${esc(t.body)}</p>
        </article>`;
    }

    function draftMenuItems() {
      if (!drafts.length) return `<div class="dd-foot">No local Drafts</div>`;
      return drafts.map(d => `
        <button class="dd-item${d.id === draftId ? " on" : ""}" type="button" data-switch="${d.id}">
          <div class="t ellipsis">${esc(titleOf(d))}</div>
          <div class="s ellipsis">${esc(accountName(d.account))} · ${esc(d.to || "no To")} · ${esc(d.created)}</div>
        </button>`).join("") +
        `<div class="dd-foot">Local Drafts are not the Drafts Mailbox. Chrome Compose always starts a new one.</div>`;
    }

    function renderCompose() {
      const d = currentDraft();
      if (!d) { composeEl.innerHTML = ""; return; }
      const fromOpts = ACCOUNTS.map(a =>
        `<option value="${a.id}" ${a.id === d.account ? "selected" : ""}>${esc(a.name)} · ${esc(a.email)}</option>`
      ).join("");
      const chips = drafts.map(x => `
        <span class="dchip${x.id === d.id ? " on" : ""}">
          <button class="pick" type="button" data-switch="${x.id}">${esc(titleOf(x))}</button>
          <button class="x" type="button" data-discard="${x.id}" aria-label="Discard">×</button>
        </span>`).join("");
      const rail = drafts.map(x => `
        <div class="rail-card${x.id === d.id ? " on" : ""}">
          <button type="button" data-switch="${x.id}" style="all:unset;display:block;cursor:pointer">
            <div class="t ellipsis">${esc(titleOf(x))}</div>
            <div class="s ellipsis">${esc(accountName(x.account))} · ${esc(x.to || "no To")}</div>
          </button>
          <button class="rail-x" type="button" data-discard="${x.id}" aria-label="Discard">×</button>
        </div>`).join("");
      composeEl.innerHTML = `
        <aside class="rail">
          <h3>Local Drafts · ${drafts.length}</h3>
          <div class="rail-note">Inside the reading pane — not a fourth column, not left nav.</div>
          <div class="rail-list">${rail || '<div class="rail-note">None</div>'}</div>
        </aside>
        <div class="form">
          <div class="chips-row">${chips}</div>
          <div class="compose-head">
            <div class="dd dd-drafts${menuOpen ? " open" : ""}">
              <button class="dd-btn" type="button" data-toggle-dd>Local Drafts (${drafts.length}) ▾</button>
              <div class="dd-menu">${draftMenuItems()}</div>
            </div>
            <span class="hint" style="margin-left:0">autosave</span>
            <span style="flex:1"></span>
            <button class="ghost" type="button" data-attach>Attach</button>
            <button class="primary head-send" type="button" data-send>Send</button>
          </div>
          <div class="compose-row"><label>From</label><select data-from>${fromOpts}</select></div>
          <div class="compose-row"><label>To</label><input data-to value="${esc(d.to)}" placeholder="name@example.com" /></div>
          <div class="compose-row"><label>Cc</label><input data-cc value="${esc(d.cc)}" placeholder="" /></div>
          <div class="compose-row"><label>Subject</label><input data-subject value="${esc(d.subject)}" placeholder="Subject" /></div>
          <textarea data-body placeholder="Write a Message…">${esc(d.body)}</textarea>
          <div class="compose-actions">
            <button class="primary" type="button" data-send>Send</button>
            <button class="ghost foot-discard" type="button" data-discard="${d.id}">Discard</button>
            <span class="hint">Ctrl+Enter send · Esc discard · chrome Compose starts another</span>
          </div>
        </div>`;
    }

    function renderOutboxPane() {
      const o = selectedOutbox();
      if (!o) { outboxEl.innerHTML = ""; return; }
      const fail = o.status === "failed";
      const acts = fail
        ? `<button class="primary" type="button" data-retry="${o.id}">Retry</button><button class="ghost" type="button" data-odiscard="${o.id}">Discard</button>`
        : `<button class="ghost" type="button" data-odiscard="${o.id}">Discard</button>`;
      outboxEl.innerHTML = `
        <div class="thread-head">
          <div class="head-text">
            <h2>${esc(o.subject)}</h2>
            <div class="sub">Outbox · ${esc(accountName(o.account))} · not editable here</div>
          </div>
          <button class="more" type="button" data-more="outbox" aria-label="Outbox commands">${moreSvg()}</button>
        </div>
        <div class="status-card">
          <div class="status-big ${fail ? "fail" : "queue"}">${fail ? "Failed" : "Queued"} · ${fail ? "Retry to re-queue" : "flushes with Sync"}</div>
          <div class="kv">
            <span>To</span><b>${esc(o.to)}</b>
            <span>From</span><b>${esc(accountName(o.account))}</b>
            <span>When</span><b>${esc(o.when)}</b>
            ${fail ? `<span>Error</span><b>${esc(o.error)}</b>` : ""}
          </div>
          <ul class="timeline">
            <li>Queued ${esc(o.when)}</li>
            ${fail ? `<li>Failed ${esc(o.error)}</li>` : `<li>Waiting for Sync (${nav === "unified" ? "all Accounts" : "this Account"})</li>`}
          </ul>
          <p>${esc(o.body)}</p>
          <div class="inspector-acts">${acts}</div>
        </div>`;
    }

    function render() {
      app.dataset.variant = variant;
      if (nav.endsWith("/outbox") && surface !== "compose") {
        const items = outboxFor(nav.split("/")[0]);
        surface = items.length ? "outbox" : "empty";
      }
      app.dataset.surface = surface;
      const v = VARIANTS.find(x => x.key === variant);
      document.getElementById("vlabel").textContent = v.key + " — " + v.name;
      document.querySelector("[data-empty-label]").textContent =
        nav.endsWith("/outbox") ? "Outbox is empty" :
        nav.endsWith("/drafts") ? "Select a server Draft" : "Select a Thread";
      renderNav();
      renderList();
      renderReading();
      renderCompose();
      renderOutboxPane();
      paintState();
      writeUrl();
    }

    function bindComposeFields() {
      const d = currentDraft();
      if (!d || surface !== "compose") return;
      const map = [["data-to", "to"], ["data-cc", "cc"], ["data-subject", "subject"], ["data-body", "body"]];
      map.forEach(([attr, key]) => {
        const el = composeEl.querySelector("[" + attr + "]");
        if (!el) return;
        el.addEventListener("input", () => { d[key] = el.value; paintState(); });
      });
      const from = composeEl.querySelector("[data-from]");
      if (from) from.addEventListener("change", () => { d.account = from.value; lastAction = "From " + d.account; paintState(); });
    }

    function paint() {
      render();
      bindComposeFields();
    }

    function cycle(dir) {
      const i = VARIANTS.findIndex(v => v.key === variant);
      variant = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key;
      menuOpen = false;
      lastAction = "variant " + variant;
      hideMenu();
      paint();
    }

    function placeMenu(x, y, html) {
      ctx.innerHTML = html;
      ctx.style.display = "block";
      const r = ctx.getBoundingClientRect();
      ctx.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
      ctx.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
    }

    function threadMenu() {
      return ["Reply", "Reply all", "Forward", "Mark unread", "Flag", "Move…", "Delete"]
        .map(n => `<button type="button" data-act="${n}">${n}</button>`).join("");
    }
    function outboxMenu(o) {
      const retry = o.status === "failed" ? `<button type="button" data-act="Retry">Retry</button>` : "";
      return retry + `<button type="button" data-act="Discard Outbox">Discard</button>`;
    }

    document.getElementById("prev").onclick = () => cycle(-1);
    document.getElementById("next").onclick = () => cycle(1);
    document.getElementById("reset").onclick = () => {
      drafts = seedDrafts();
      outbox = seedOutbox();
      draftId = 1;
      outboxId = 1;
      nextDraft = 4;
      nextOutbox = 3;
      nav = "unified";
      thread = 0;
      surface = "reading";
      menuOpen = false;
      lastAction = "reset seed";
      paint();
    };

    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        if (e.target.closest("input, textarea, [contenteditable], select")) return;
        if (e.key === "ArrowLeft") cycle(-1);
        if (e.key === "ArrowRight") cycle(1);
        return;
      }
      if (e.key === "Escape" && surface === "compose" && currentDraft()) {
        e.preventDefault();
        discardDraft(currentDraft().id);
        paint();
        return;
      }
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && surface === "compose") {
        e.preventDefault();
        sendCurrent();
        paint();
      }
    });

    app.addEventListener("click", (e) => {
      const navBtn = e.target.closest("[data-nav]");
      if (navBtn) {
        leaveCompose();
        nav = navBtn.getAttribute("data-nav");
        if (nav.endsWith("/outbox")) {
          const items = outboxFor(nav.split("/")[0]);
          outboxId = items[0] ? items[0].id : null;
          surface = items.length ? "outbox" : "empty";
        } else if (nav.endsWith("/drafts")) {
          surface = "reading";
        } else {
          surface = "reading";
        }
        lastAction = "nav " + nav;
        hideMenu();
        paint();
        return;
      }
      const th = e.target.closest(".thread");
      if (th) {
        leaveCompose();
        thread = Number(th.dataset.i);
        surface = "reading";
        THREADS[thread].unread = false;
        lastAction = "select thread " + thread;
        hideMenu();
        paint();
        return;
      }
      const ob = e.target.closest(".obox");
      if (ob && !e.target.closest("[data-retry], [data-odiscard]")) {
        leaveCompose();
        outboxId = Number(ob.dataset.oid);
        surface = "outbox";
        lastAction = "select outbox " + outboxId;
        hideMenu();
        paint();
        return;
      }
      const sd = e.target.closest(".sdraft");
      if (sd) {
        leaveCompose();
        serverDraft = Number(sd.dataset.si);
        surface = "reading";
        lastAction = "server Draft (not local)";
        showToast("Server Draft — not local; compose stays closed");
        hideMenu();
        paint();
        return;
      }
      if (e.target.closest("[data-compose]")) {
        newDraft({});
        showToast("New local Draft · switcher is inside compose");
        paint();
        return;
      }
      if (e.target.closest("[data-sync]")) {
        syncing = true;
        flushOutbox();
        syncing = false;
        paint();
        return;
      }
      if (e.target.closest("[data-add]")) { showToast("Add Account — out of scope"); return; }
      if (e.target.closest("[data-toggle-dd]")) {
        menuOpen = !menuOpen;
        paint();
        return;
      }
      const sw = e.target.closest("[data-switch]");
      if (sw) {
        const keep = Number(sw.getAttribute("data-switch"));
        pruneEmptyExcept(keep);
        draftId = keep;
        surface = "compose";
        menuOpen = false;
        lastAction = "switch Draft " + keep;
        paint();
        return;
      }
      if (e.target.closest("[data-send]")) { sendCurrent(); paint(); return; }
      const disc = e.target.closest("[data-discard]");
      if (disc) { discardDraft(Number(disc.getAttribute("data-discard"))); paint(); return; }
      const retry = e.target.closest("[data-retry]");
      if (retry) { retryOutbox(Number(retry.getAttribute("data-retry"))); paint(); return; }
      const od = e.target.closest("[data-odiscard]");
      if (od) { discardOutbox(Number(od.getAttribute("data-odiscard"))); paint(); return; }
      if (e.target.closest("[data-attach]")) { showToast("Attach — compose surface"); return; }
      const more = e.target.closest("[data-more]");
      if (more) {
        const kind = more.getAttribute("data-more");
        const r = more.getBoundingClientRect();
        if (kind === "outbox") placeMenu(r.right - 8, r.bottom + 4, outboxMenu(selectedOutbox() || { status: "queued" }));
        else placeMenu(r.right - 8, r.bottom + 4, threadMenu());
        ctx.dataset.kind = kind;
        return;
      }
      ctx.style.display = "none";
    });

    threadsEl.addEventListener("contextmenu", (e) => {
      const ob = e.target.closest(".obox");
      const th = e.target.closest(".thread");
      if (ob) {
        e.preventDefault();
        outboxId = Number(ob.dataset.oid);
        surface = "outbox";
        paint();
        ctx.dataset.kind = "outbox";
        placeMenu(e.clientX, e.clientY, outboxMenu(selectedOutbox()));
        return;
      }
      if (th) {
        e.preventDefault();
        thread = Number(th.dataset.i);
        paint();
        ctx.dataset.kind = "thread";
        placeMenu(e.clientX, e.clientY, threadMenu());
      }
    });
    readEl.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      ctx.dataset.kind = "thread";
      placeMenu(e.clientX, e.clientY, threadMenu());
    });
    outboxEl.addEventListener("contextmenu", (e) => {
      e.preventDefault();
      ctx.dataset.kind = "outbox";
      placeMenu(e.clientX, e.clientY, outboxMenu(selectedOutbox() || { status: "queued" }));
    });
    ctx.addEventListener("click", (e) => {
      const b = e.target.closest("[data-act]");
      if (!b) { hideMenu(); return; }
      const act = b.getAttribute("data-act");
      if (act === "Reply" || act === "Reply all" || act === "Forward") {
        const t = THREADS[thread];
        newDraft({
          to: act === "Forward" ? "" : "alex@example.com",
          subject: (act === "Forward" ? "Fw: " : "Re: ") + (t ? t.subject : ""),
          body: t ? "\n\nOn " + t.when + ", " + t.from + " wrote:\n> " + t.body : "",
        });
        showToast(act + " opens compose in the pane");
        hideMenu();
        paint();
        return;
      }
      if (act === "Retry") { retryOutbox(outboxId); hideMenu(); paint(); return; }
      if (act === "Discard Outbox") { discardOutbox(outboxId); hideMenu(); paint(); return; }
      showToast(act + " — " + ctx.dataset.kind + " menu");
      hideMenu();
    });
    document.addEventListener("click", (e) => {
      if (!e.target.closest("#ctx, [data-more]")) hideMenu();
    });

    paint();
  </script>
</body>
</html>
