<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — 3-pane Fluent daily shell</title>
  <!--
    PROTOTYPE — throwaway. Not product UI.
    Question: Does a compact Fluent 3-pane daily shell feel like a product
    rather than the current 4-column tool chrome?
    Three chrome placements, switchable via ?variant=A|B|C.
    A — Window CommandBar (canonical lock from #209)
    B — Content CommandBar (nav independent)
    C — List-header CommandBar
    Empty scene: ?empty=1
  -->
  <style>
    :root {
      --text: rgba(0, 0, 0, .9);
      --text-2: rgba(0, 0, 0, .61);
      --text-3: rgba(0, 0, 0, .45);
      --accent: #005fb8;
      --accent-hover: #005ba1;
      --accent-text: #fff;
      --bg: #f3f3f3;
      --layer: #fff;
      --nav: #f7f7f7;
      --stroke: rgba(0, 0, 0, .08);
      --hover: rgba(0, 0, 0, .045);
      --pressed: rgba(0, 0, 0, .07);
      --selected: #cfe4fa;
      --error: #c42b1c;
      --badge: #005fb8;
      --focus: #005fb8;
      --shadow: 0 8px 24px rgba(0, 0, 0, .18);
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      --nav-w: 260px;
      --list-w: 340px;
      --row: 28px;
      --thread: 56px;
      --bar: 40px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --text: rgba(255, 255, 255, .95);
        --text-2: rgba(255, 255, 255, .7);
        --text-3: rgba(255, 255, 255, .5);
        --accent: #60cdff;
        --accent-hover: #99ebff;
        --accent-text: #000;
        --bg: #202020;
        --layer: #2c2c2c;
        --nav: #272727;
        --stroke: rgba(255, 255, 255, .08);
        --hover: rgba(255, 255, 255, .06);
        --pressed: rgba(255, 255, 255, .08);
        --selected: #1a3d5c;
        --error: #ff99a4;
        --badge: #60cdff;
        --focus: #60cdff;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font: 13px/1.3 var(--font);
      color: var(--text);
      background: var(--bg);
      overflow: hidden;
    }
    button, input, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .commandbar {
      display: flex;
      align-items: center;
      gap: 4px;
      height: var(--bar);
      padding: 0 8px;
      background: var(--layer);
      border-bottom: 1px solid var(--stroke);
      flex-shrink: 0;
    }
    .cmd {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 32px;
      padding: 0 10px;
      border: 0;
      border-radius: 4px;
      background: transparent;
    }
    .cmd:hover { background: var(--hover); }
    .cmd:active { background: var(--pressed); }
    .cmd svg { width: 16px; height: 16px; fill: currentColor; }
    .cmd.accent { background: var(--accent); color: var(--accent-text); }
    .cmd.accent:hover { background: var(--accent-hover); }

    .bar-window { display: none; }
    .bar-content { display: none; }
    .bar-list { display: none; }
    .app[data-variant="A"] .bar-window { display: flex; }
    .app[data-variant="B"] .bar-content { display: flex; }
    .app[data-variant="C"] .bar-list { display: flex; border: 0; height: auto; padding: 0; background: transparent; }

    .shell {
      display: grid;
      grid-template-columns: var(--nav-w) 1px var(--list-w) 1px minmax(0, 1fr);
      grid-template-rows: 1fr;
      flex: 1;
      min-height: 0;
    }
    .nav { grid-column: 1; grid-row: 1 / -1; }
    .split-ns { grid-column: 2; grid-row: 1 / -1; background: var(--stroke); }
    .list { grid-column: 3; grid-row: 1; }
    .split-lr { grid-column: 4; grid-row: 1; background: var(--stroke); }
    .reading { grid-column: 5; grid-row: 1; }
    .app[data-variant="B"] .shell { grid-template-rows: var(--bar) 1fr; }
    .app[data-variant="B"] .bar-content { grid-column: 3 / -1; grid-row: 1; }
    .app[data-variant="B"] .list { grid-row: 2; }
    .app[data-variant="B"] .split-lr { grid-row: 2; }
    .app[data-variant="B"] .reading { grid-row: 2; }

    .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }

    .nav { background: var(--nav); padding: 6px 6px 0; }
    .nav-scroll { overflow: auto; flex: 1; }
    .tree-item, .tree-child, .tree-account {
      display: flex;
      align-items: center;
      gap: 8px;
      height: var(--row);
      padding: 0 8px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      width: 100%;
      text-align: left;
    }
    .tree-item:hover, .tree-child:hover { background: var(--hover); }
    .tree-item[aria-selected="true"],
    .tree-child[aria-selected="true"] { background: var(--selected); }
    .tree-item svg, .tree-child svg, .tree-account svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
    .tree-item.unified { font-weight: 600; margin-bottom: 4px; }
    .chev { width: 10px; height: 10px; opacity: .65; }
    .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .count { color: var(--text-2); font-size: 12px; }
    .badge {
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px;
      background: var(--badge); color: var(--accent-text);
      font-size: 11px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .account-block { margin: 2px 0 6px; }
    .tree-child { padding-left: 34px; }
    .status-idle { width: 12px; }
    .status-error { color: var(--error); }
    .spin {
      width: 12px; height: 12px;
      border: 2px solid var(--stroke);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .nav-footer { border-top: 1px solid var(--stroke); padding: 6px 0; }
    .add-account {
      display: flex; align-items: center; gap: 8px;
      height: 32px; width: 100%; padding: 0 8px;
      border: 0; border-radius: 4px; background: transparent; color: var(--accent);
    }
    .add-account:hover { background: var(--hover); }
    .add-account svg { width: 16px; height: 16px; }

    .list, .reading { background: var(--layer); }
    .list-header {
      display: flex; align-items: center; gap: 8px;
      min-height: 48px; padding: 8px;
      border-bottom: 1px solid var(--stroke); flex-shrink: 0;
    }
    .scope { font-size: 12px; color: var(--text-2); white-space: nowrap; }
    .search {
      flex: 1; display: flex; align-items: center; gap: 8px;
      height: 32px; padding: 0 10px;
      border: 1px solid var(--stroke); border-radius: 4px; background: var(--bg);
    }
    .search:focus-within { outline: 2px solid var(--focus); outline-offset: -1px; }
    .search svg { width: 14px; height: 14px; fill: var(--text-3); }
    .search input { flex: 1; border: 0; background: transparent; outline: none; min-width: 0; }
    .threads { overflow: auto; flex: 1; padding: 4px; }
    .thread {
      display: grid;
      grid-template-columns: 1fr auto;
      column-gap: 8px;
      min-height: var(--thread);
      padding: 8px 10px;
      border: 0; border-radius: 4px; background: transparent;
      width: 100%; text-align: left;
    }
    .thread:hover { background: var(--hover); }
    .thread[aria-selected="true"] { background: var(--selected); }
    .thread .from { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .thread.unread .from { font-weight: 600; }
    .thread .when { color: var(--text-2); font-size: 12px; }
    .thread .subject {
      grid-column: 1 / -1; color: var(--text-2);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .thread.unread .subject { color: var(--text); }

    .read-empty, .read-thread, .compose {
      display: none; flex-direction: column; min-height: 0; height: 100%;
    }
    .app[data-surface="empty"] .read-empty { display: flex; }
    .app[data-surface="reading"] .read-thread { display: flex; overflow: auto; }
    .app[data-surface="compose"] .compose { display: flex; }
    .read-empty {
      align-items: center; justify-content: center;
      color: var(--text-3); gap: 8px;
    }
    .read-empty svg { width: 40px; height: 40px; fill: currentColor; }
    .msg { padding: 16px 20px 12px; border-bottom: 1px solid var(--stroke); }
    .msg h2 { font-size: 18px; font-weight: 600; margin: 0 0 8px; }
    .msg .meta { color: var(--text-2); font-size: 12px; margin-bottom: 12px; }
    .msg p { margin: 0 0 8px; max-width: 62ch; }
    .attach {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 8px; padding: 6px 10px;
      border: 1px solid var(--stroke); border-radius: 4px; font-size: 12px;
    }
    .attach svg { width: 14px; height: 14px; fill: currentColor; }
    .compose { padding: 12px 16px; gap: 8px; }
    .compose-row {
      display: flex; align-items: center; gap: 8px;
      border-bottom: 1px solid var(--stroke); padding: 4px 0;
    }
    .compose-row label { color: var(--text-2); width: 52px; }
    .compose-row input, .compose textarea {
      flex: 1; border: 0; background: transparent; outline: none; padding: 6px 0;
    }
    .compose textarea { flex: 1; resize: none; }
    .compose-actions { display: flex; gap: 8px; }
    .primary {
      height: 32px; padding: 0 14px; border: 0; border-radius: 4px;
      background: var(--accent); color: var(--accent-text);
    }
    .ghost {
      height: 32px; padding: 0 14px; border: 1px solid var(--stroke);
      border-radius: 4px; background: transparent;
    }

    .empty-page {
      display: none; height: 100%;
      align-items: center; justify-content: center; background: var(--bg);
    }
    .app[data-empty="1"] .empty-page { display: flex; }
    .app[data-empty="1"] .bar-window,
    .app[data-empty="1"] .shell { display: none !important; }
    .empty-card {
      display: flex; flex-direction: column; align-items: center;
      gap: 12px; text-align: center; max-width: 380px; padding: 32px;
    }
    .empty-card svg { width: 64px; height: 64px; fill: var(--accent); }
    .empty-card h1 { font-size: 20px; font-weight: 600; margin: 0; }
    .empty-card p { margin: 0; color: var(--text-2); }

    .ctx {
      display: none; position: fixed; z-index: 20; min-width: 180px;
      padding: 4px; background: var(--layer); border: 1px solid var(--stroke);
      border-radius: 8px; box-shadow: var(--shadow);
    }
    .ctx button {
      display: block; width: 100%; text-align: left; border: 0;
      background: transparent; padding: 6px 10px; border-radius: 4px;
    }
    .ctx button:hover { background: var(--hover); }
    .toast {
      position: fixed; right: 16px; bottom: 64px; z-index: 40;
      display: none; padding: 10px 14px; background: var(--layer);
      border: 1px solid var(--stroke); border-radius: 8px; box-shadow: var(--shadow);
    }
    .switcher {
      position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
      z-index: 50; display: flex; align-items: center; gap: 8px;
      padding: 6px 10px; border-radius: 999px; background: #111; color: #fff;
      box-shadow: var(--shadow);
      font: 12px/1.2 ui-monospace, Consolas, monospace;
      user-select: none;
    }
    .switcher button {
      width: 28px; height: 28px; border: 0; border-radius: 50%;
      background: #333; color: #fff;
    }
    .switcher button:hover { background: #444; }
    .switcher .vlabel { min-width: 230px; text-align: center; }
    .switcher .tog { width: auto; padding: 0 10px; border-radius: 999px; }
    .switcher .state { color: #9ad; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="app" data-variant="A" data-empty="0" data-surface="reading">
    <div class="commandbar bar-window">
      <button class="cmd accent" data-compose type="button">
        <svg viewBox="0 0 16 16"><path d="M2 13.5V11l7.4-7.4 2.5 2.5L4.5 13.5H2zm9.1-9.1.9-.9a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1 0 1.4l-.9.9-2.5-2.5z"/></svg>
        Compose
      </button>
      <button class="cmd" data-sync type="button">
        <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 5.3 3.2l-1.3.8A4.5 4.5 0 1 1 8 3.5V6l3-2.5L8 1v1z"/></svg>
        Sync
      </button>
    </div>

    <div class="shell">
      <nav class="pane nav">
        <div class="nav-scroll">
          <button class="tree-item unified" data-nav="unified" aria-selected="true" type="button">
            <svg viewBox="0 0 16 16"><path d="M1 3.5 8 1l7 2.5v9L8 15 1 12.5v-9zM8 2.2 2.2 4.2v7.6L8 13.8l5.8-2V4.2L8 2.2z"/></svg>
            <span class="label">Unified Inbox</span>
            <span class="count">14</span>
          </button>
          <div class="account-block">
            <div class="tree-account">
              <svg class="chev" viewBox="0 0 12 12"><path d="M3 2l6 4-6 4z"/></svg>
              <span class="label">Personal</span>
              <span class="status-idle" title="Idle"></span>
            </div>
            <button class="tree-child" data-nav="personal/inbox" type="button"><span class="label">Inbox</span><span class="count">8</span></button>
            <button class="tree-child" data-nav="personal/sent" type="button"><span class="label">Sent</span></button>
            <button class="tree-child" data-nav="personal/drafts" type="button"><span class="label">Drafts</span></button>
            <button class="tree-child" data-nav="personal/trash" type="button"><span class="label">Trash</span></button>
            <button class="tree-child" data-nav="personal/outbox" type="button"><span class="label">Outbox</span><span class="badge">2</span></button>
          </div>
          <div class="account-block">
            <div class="tree-account">
              <svg class="chev" viewBox="0 0 12 12"><path d="M3 2l6 4-6 4z"/></svg>
              <span class="label">Work</span>
              <span class="spin" title="Syncing"></span>
            </div>
            <button class="tree-child" data-nav="work/inbox" type="button"><span class="label">Inbox</span><span class="count">6</span></button>
            <button class="tree-child" data-nav="work/sent" type="button"><span class="label">Sent</span></button>
            <button class="tree-child" data-nav="work/outbox" type="button"><span class="label">Outbox</span></button>
          </div>
          <div class="account-block">
            <div class="tree-account">
              <svg class="chev" viewBox="0 0 12 12"><path d="M3 2l6 4-6 4z"/></svg>
              <span class="label">QQ Mail</span>
              <svg class="status-error" viewBox="0 0 16 16"><path d="M8 1a7 7 0 1 1 0 14A7 7 0 0 1 8 1zm0 3 .9 5H7.1L8 4zm0 7.2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"/></svg>
            </div>
            <button class="tree-child" data-nav="qq/inbox" type="button"><span class="label">Inbox</span></button>
            <button class="tree-child" data-nav="qq/outbox" type="button"><span class="label">Outbox</span></button>
          </div>
        </div>
        <div class="nav-footer">
          <button class="add-account" data-add type="button">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v10M3 8h10"/></svg>
            Add Account
          </button>
        </div>
      </nav>
      <div class="split-ns"></div>

      <div class="commandbar bar-content">
        <button class="cmd accent" data-compose type="button">
          <svg viewBox="0 0 16 16"><path d="M2 13.5V11l7.4-7.4 2.5 2.5L4.5 13.5H2zm9.1-9.1.9-.9a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1 0 1.4l-.9.9-2.5-2.5z"/></svg>
          Compose
        </button>
        <button class="cmd" data-sync type="button">
          <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 5.3 3.2l-1.3.8A4.5 4.5 0 1 1 8 3.5V6l3-2.5L8 1v1z"/></svg>
          Sync
        </button>
      </div>

      <section class="pane list">
        <div class="list-header">
          <div class="commandbar bar-list">
            <button class="cmd accent" data-compose type="button">
              <svg viewBox="0 0 16 16"><path d="M2 13.5V11l7.4-7.4 2.5 2.5L4.5 13.5H2zm9.1-9.1.9-.9a1 1 0 0 1 1.4 0l1.1 1.1a1 1 0 0 1 0 1.4l-.9.9-2.5-2.5z"/></svg>
              Compose
            </button>
            <button class="cmd" data-sync type="button">
              <svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 0 5.3 3.2l-1.3.8A4.5 4.5 0 1 1 8 3.5V6l3-2.5L8 1v1z"/></svg>
              Sync
            </button>
          </div>
          <span class="scope" data-scope>Unified Inbox</span>
          <label class="search">
            <svg viewBox="0 0 16 16"><path d="M7 2a5 5 0 1 1 3.4 8.6l2.8 2.8-.7.7-2.8-2.8A5 5 0 0 1 7 2zm0 1.2a3.8 3.8 0 1 0 0 7.6 3.8 3.8 0 0 0 0-7.6z"/></svg>
            <input id="search" placeholder="Search  is:unread  is:flagged" />
          </label>
        </div>
        <div class="threads" id="threads"></div>
      </section>
      <div class="split-lr"></div>

      <section class="pane reading">
        <div class="read-empty">
          <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v.8l7 4.2 7-4.2V7H5zm0 3.3V17h14V10.3l-7 4.2-7-4.2z"/></svg>
          Select a thread
        </div>
        <div class="read-thread" id="read-thread"></div>
        <div class="compose">
          <div class="compose-row"><label>To</label><input placeholder="name@example.com" /></div>
          <div class="compose-row"><label>Subject</label><input placeholder="Subject" /></div>
          <textarea placeholder="Write a message…"></textarea>
          <div class="compose-actions">
            <button class="primary" type="button" data-send>Send</button>
            <button class="ghost" type="button" data-discard>Discard</button>
          </div>
        </div>
      </section>
    </div>

    <div class="empty-page">
      <div class="empty-card">
        <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v.8l7 4.2 7-4.2V7H5zm0 3.3V17h14V10.3l-7 4.2-7-4.2z"/></svg>
        <h1>Add an Account</h1>
        <p>Mailtide shows Unified Inbox and Mailboxes after the first Account is added. The three-pane shell stays away until then.</p>
        <button class="primary" type="button" data-add>Add Account</button>
      </div>
    </div>
  </div>

  <div class="ctx" id="ctx" role="menu">
    <button type="button">Reply</button>
    <button type="button">Reply all</button>
    <button type="button">Forward</button>
    <button type="button">Mark unread</button>
    <button type="button">Flag</button>
    <button type="button">Move…</button>
    <button type="button">Delete</button>
  </div>
  <div class="toast" id="toast"></div>

  <div class="switcher" id="switcher">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <div class="vlabel" id="vlabel">A — Window CommandBar</div>
    <button type="button" id="next" aria-label="Next variant">→</button>
    <button class="tog" type="button" id="empty">Zero Accounts</button>
    <div class="state" id="state"></div>
  </div>

  <script>
    const VARIANTS = [
      { key: "A", name: "Window CommandBar" },
      { key: "B", name: "Content CommandBar" },
      { key: "C", name: "List-header CommandBar" },
    ];
    const THREADS = [
      { from: "Alex Chen", subject: "Q3 planning notes", when: "9:14 AM", unread: true, body: "Can we lock the Fluent shell before we start tickets? I want the daily surface to feel like mail, not a debug console." },
      { from: "Jordan Lee", subject: "Invoice 1842", when: "Yesterday", unread: true, body: "Invoice attached. Let me know if the reading pane should show the PDF chip here rather than a fourth column." },
      { from: "Samira", subject: "Re: weekend hike", when: "Mon", unread: false, body: "Leaving at 7. I'll bring the extra water filter." },
      { from: "GitHub", subject: "[Mailtide] CI passed on main", when: "Sun", unread: false, body: "All 142 checks were successful." },
      { from: "Work standup", subject: "Tomorrow's agenda", when: "Sat", unread: false, body: "Keep it to 15 minutes. Sync status is silent when Idle." },
    ];
    const SCOPES = {
      unified: "Unified Inbox",
      "personal/inbox": "Inbox · Personal",
      "personal/sent": "Sent · Personal",
      "personal/drafts": "Drafts · Personal",
      "personal/trash": "Trash · Personal",
      "personal/outbox": "Outbox · Personal",
      "work/inbox": "Inbox · Work",
      "work/sent": "Sent · Work",
      "work/outbox": "Outbox · Work",
      "qq/inbox": "Inbox · QQ Mail",
      "qq/outbox": "Outbox · QQ Mail",
    };

    const app = document.querySelector(".app");
    const params = new URLSearchParams(location.search);
    let variant = (params.get("variant") || "A").toUpperCase();
    if (!VARIANTS.some(v => v.key === variant)) variant = "A";
    let empty = params.get("empty") === "1";
    let nav = "unified";
    let thread = 0;
    let surface = "reading";
    let syncing = false;

    const threadsEl = document.getElementById("threads");
    const readEl = document.getElementById("read-thread");
    const ctx = document.getElementById("ctx");
    const toast = document.getElementById("toast");

    function writeUrl() {
      const next = new URLSearchParams();
      next.set("variant", variant);
      if (empty) next.set("empty", "1");
      history.replaceState(null, "", "?" + next.toString());
    }

    function render() {
      app.dataset.variant = variant;
      app.dataset.empty = empty ? "1" : "0";
      app.dataset.surface = surface;
      const v = VARIANTS.find(x => x.key === variant);
      document.getElementById("vlabel").textContent = v.key + " — " + v.name;
      document.querySelector("[data-scope]").textContent = SCOPES[nav] || nav;
      document.querySelectorAll("[data-nav]").forEach(el => {
        el.setAttribute("aria-selected", el.getAttribute("data-nav") === nav ? "true" : "false");
      });
      threadsEl.innerHTML = THREADS.map((t, i) => `
        <button class="thread${t.unread ? " unread" : ""}" data-i="${i}" aria-selected="${i === thread}" type="button">
          <span class="from">${t.from}</span>
          <span class="when">${t.when}</span>
          <span class="subject">${t.subject}</span>
        </button>`).join("");
      const t = THREADS[thread];
      readEl.innerHTML = t ? `
        <article class="msg">
          <h2>${t.subject}</h2>
          <div class="meta">${t.from} · ${t.when} · to you</div>
          <p>${t.body}</p>
          ${t.from === "Jordan Lee" ? `<span class="attach"><svg viewBox="0 0 16 16"><path d="M4 2h5l3 3v9H4V2zm5 0v3h3"/></svg> invoice-1842.pdf</span>` : ""}
        </article>
        <article class="msg">
          <div class="meta">You · earlier</div>
          <p>Placeholder earlier message in this Thread. Field-level reading chrome is a later ticket.</p>
        </article>` : "";
      document.getElementById("state").textContent =
        `empty=${empty} nav=${nav} thread=${thread} surface=${surface} sync=${syncing ? "on" : "off"}`;
      writeUrl();
    }

    function cycle(dir) {
      const i = VARIANTS.findIndex(v => v.key === variant);
      variant = VARIANTS[(i + dir + VARIANTS.length) % VARIANTS.length].key;
      render();
    }

    function showToast(text) {
      toast.textContent = text;
      toast.style.display = "block";
      clearTimeout(showToast.t);
      showToast.t = setTimeout(() => { toast.style.display = "none"; }, 1800);
    }

    document.getElementById("prev").onclick = () => cycle(-1);
    document.getElementById("next").onclick = () => cycle(1);
    document.getElementById("empty").onclick = () => { empty = !empty; render(); };

    document.addEventListener("keydown", (e) => {
      if (e.target.closest("input, textarea, [contenteditable]")) return;
      if (e.key === "ArrowLeft") cycle(-1);
      if (e.key === "ArrowRight") cycle(1);
    });

    app.addEventListener("click", (e) => {
      const navBtn = e.target.closest("[data-nav]");
      if (navBtn) {
        nav = navBtn.getAttribute("data-nav");
        surface = thread == null ? "empty" : "reading";
        render();
        return;
      }
      const th = e.target.closest(".thread");
      if (th) {
        thread = Number(th.dataset.i);
        surface = "reading";
        THREADS[thread].unread = false;
        render();
        return;
      }
      if (e.target.closest("[data-compose]")) { surface = "compose"; render(); return; }
      if (e.target.closest("[data-sync]")) {
        syncing = true;
        render();
        showToast(nav === "unified" ? "Sync all Accounts" : "Sync selected Account");
        setTimeout(() => { syncing = false; render(); }, 1200);
        return;
      }
      if (e.target.closest("[data-add]")) {
        if (empty) { empty = false; render(); showToast("Account added — three-pane appears"); }
        else showToast("Add Account dialog — out of scope");
        return;
      }
      if (e.target.closest("[data-send]")) {
        surface = "reading";
        render();
        showToast("Queued to Outbox · flushes with Sync");
        return;
      }
      if (e.target.closest("[data-discard]")) { surface = "reading"; render(); return; }
      ctx.style.display = "none";
    });

    threadsEl.addEventListener("contextmenu", (e) => {
      const th = e.target.closest(".thread");
      if (!th) return;
      e.preventDefault();
      thread = Number(th.dataset.i);
      render();
      ctx.style.display = "block";
      ctx.style.left = e.clientX + "px";
      ctx.style.top = e.clientY + "px";
    });
    ctx.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (b) showToast(b.textContent + " — object menu, not chrome");
      ctx.style.display = "none";
    });

    render();
  </script>
</body>
</html>
